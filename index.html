<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a0e;touch-action:none}
#root{width:100%;height:100dvh;display:flex;flex-direction:column;font-family:'Segoe UI',Arial,sans-serif}
 
/* ── HUD ── */
#hud{display:flex;align-items:center;padding:5px 10px;
  background:linear-gradient(180deg,#1e2010 0%,#141608 100%);
  border-bottom:2px solid #5a6020;flex-shrink:0;gap:6px;min-height:42px}
.hs{display:flex;flex-direction:column;align-items:center;min-width:36px}
.hl{font-size:7px;color:#8a9040;letter-spacing:.5px;text-transform:uppercase;font-family:'Courier New',monospace}
.hv{font-size:11px;color:#d4c040;font-weight:bold;line-height:1;text-shadow:0 0 8px #d4c04088}
.brow{display:flex;align-items:center;gap:4px;flex:1}
.blab{font-size:7px;color:#8a9040;width:14px;flex-shrink:0;font-family:'Courier New',monospace}
.bwrap{flex:1;height:9px;background:#0a0c04;border:1px solid #3a4010;border-radius:4px;overflow:hidden;min-width:36px;box-shadow:inset 0 1px 3px #00000088}
.bhp{height:100%;background:linear-gradient(90deg,#205810,#40b020,#60e030);border-radius:4px;transition:width .12s}
.ben{height:100%;background:linear-gradient(90deg,#102858,#2060b0,#40a0e0);border-radius:4px;transition:width .12s}
 
/* ── 3D CANVAS WRAPPER ── */
#cw{flex:1;position:relative;overflow:hidden}
#gc_container{display:block;width:100%;height:100%}
 
/* ── BOSS BAR ── */
#bbar{position:absolute;bottom:0;left:0;right:0;height:30px;
  background:linear-gradient(180deg,#200000aa,#3a0000cc);
  border-top:2px solid #aa0000;display:none;align-items:center;padding:0 12px;gap:10px;z-index:10}
.bbn{font-size:9px;color:#ff5050;letter-spacing:1px;min-width:110px;text-transform:uppercase;font-family:'Courier New',monospace;text-shadow:0 0 8px #ff5050}
.bbw{flex:1;height:11px;background:#1a0000;border:1px solid #880000;border-radius:4px;overflow:hidden;box-shadow:inset 0 1px 3px #000}
.bbf{height:100%;background:linear-gradient(90deg,#880000,#ff3000,#ff5020);border-radius:4px;transition:width .15s}
 
/* ── NOTIF ── */
#notif{position:absolute;top:8px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#2a2800ee,#1a1800ee);
  border:1px solid #d4c040;color:#f0e060;font-size:10px;padding:5px 16px;
  border-radius:20px;pointer-events:none;opacity:0;transition:opacity .3s;
  white-space:nowrap;z-index:300;max-width:94%;
  box-shadow:0 4px 20px #d4c04033,0 0 0 1px #00000044;font-family:'Courier New',monospace}
 
/* ── CONTROLS ── */
#ctrl{display:flex;align-items:flex-end;justify-content:space-between;
  padding:6px 12px 10px;
  padding-bottom:max(10px,env(safe-area-inset-bottom,10px));
  background:linear-gradient(0deg,rgba(10,12,4,.92) 0%,rgba(18,20,8,.7) 100%);
  border-top:1px solid rgba(90,96,32,.4);flex-shrink:0;position:relative;height:130px}
 
/* WEAPON SLOTS */
#wslots{display:flex;flex-direction:column;gap:6px;justify-content:flex-end;padding-bottom:4px}
.wslot-btn{width:58px;height:58px;border-radius:14px;cursor:pointer;border:none;
  -webkit-appearance:none;display:flex;flex-direction:column;align-items:center;
  justify-content:center;position:relative;transition:transform .08s,box-shadow .08s;overflow:hidden}
.wslot-btn.ws1{background:linear-gradient(145deg,#5a2808,#2a1004);
  box-shadow:0 4px 14px #c0401077,0 2px 0 #401008,inset 0 1px 0 #ffffff44,0 0 0 2px #c04010}
.wslot-btn.ws2{background:linear-gradient(145deg,#083060,#041830);
  box-shadow:0 4px 14px #1060a077,0 2px 0 #042040,inset 0 1px 0 #ffffff44,0 0 0 2px #1060a0}
.wslot-btn.wempty{background:linear-gradient(145deg,#1e2010,#0e1008);
  box-shadow:0 2px 8px #00000055,0 0 0 2px #3a4018;opacity:.6}
.wslot-btn.lit{transform:scale(.9);box-shadow:0 1px 4px #00000099}
.wslot-btn:active{transform:scale(.9)}
.ws-icon{font-size:22px;line-height:1}
.ws-name{font-size:6px;color:#ffffffcc;font-family:'Courier New',monospace;letter-spacing:.3px;

.ws-badge{position:absolute;top:3px;right:3px;font-size:6px;background:#000000aa;color:#ffffff;padding:1px 3px;border-radius:4px;font-family:'Courier New',monospace}
 
/* JOYSTICK */

#jbase{width:110px;height:110px;border-radius:50%;

#jknob{width:44px;height:44px;border-radius:50%;

#overlay-start{position:absolute;inset:0;background:radial-gradient(ellipse at center,#1a200a 0%,#080a04 100%);

.invrow{background:linear-gradient(135deg,#ffffff,#f4f0e0);border:1px solid #d4c890;border-radius:10px;padding:8px 12px;margin-bottom:5px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 6px #00000012,inset 0 1px 0 #ffffffcc}

.ebtn{color:#fff;background:linear-gradient(135deg,#508030,#306010);box-shadow:0 2px 4px #50803044}
.sbtn{color:#fff;background:linear-gradient(135deg,#908030,#604010);box-shadow:0 2px 4px #90803044}
 
.mslot{width:76px;height:66px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;text-align:center;padding:4px;font-family:'Courier New',monospace;transition:transform .1s;box-shadow:0 4px 12px #00000022,inset 0 1px 0 #ffffff44}

</style>

<script>
 // ═══════════════════════════════════
// AUDIO ENGINE (Web Audio API)
// ═══════════════════════════════════
let AC = null;
function ia() { 
  if (AC) return; 
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} 
}
function psh(tp) {
  ia(); if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime;
    if (tp === 'ballistic') {
      o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t);
      o.frequency.exponentialRampToValueAtTime(55, t + .09);
      g.gain.setValueAtTime(.13, t); g.gain.exponentialRampToValueAtTime(.001, t + .1);
      o.start(t); o.stop(t + .1);
    } else if (tp === 'energy') {
      o.type = 'sine'; o.frequency.setValueAtTime(1200, t);
      o.frequency.exponentialRampToValueAtTime(500, t + .07);
      g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.001, t + .07);
      o.start(t); o.stop(t + .07);
    } else {
      o.type = 'triangle'; o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(35, t + .17);
      g.gain.setValueAtTime(.16, t); g.gain.exponentialRampToValueAtTime(.001, t + .18);
      o.start(t); o.stop(t + .18);
    }
  } catch (e) {}
}

// ═══════════════════════════════════
// SAVE / LOAD SYSTEM
// ═══════════════════════════════════
function saveGame() {
  try { localStorage.setItem('iw_s_3d', JSON.stringify({ p: G.p, zone: G.zone, ts: Date.now() })); } catch (e) {}
}
function loadGame() {
  try { const r = localStorage.getItem('iw_s_3d'); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}

// Возвращает тип тайла по глобальным координатам (x, y)
function getTileType(x, y) {
  if (x < 0 || x >= WW || y < 0 || y >= WH) return 'wall';
  // Границы безопасной зоны
  if (x >= SZ_X && x < SZ_X + SZ_W && y >= SZ_Y && y < SZ_Y + SZ_H) {
    // Внутренний забор базы
    if (x === SZ_X || x === SZ_X + SZ_W - 1 || y === SZ_Y || y === SZ_Y + SZ_H - 1) {
      // Оставляем проходы на севере, юге, западе и востоке
      if (x === 52 || x === 51 || y === 52 || y === 51) return 'safe';
      return 'fence';
    }
    return 'safe';
  }
  // Математическая генерация естественных препятствий (озера, горы, стены)
  const n1 = Math.sin(x * 0.15) * Math.cos(y * 0.15);
  const n2 = Math.sin(x * 0.05) * Math.sin(y * 0.05);
  const v = n1 * 0.6 + n2 * 0.4;
  if (v < -0.45) return 'water';
  if (v > 0.42) return 'wall';
  if (v > 0.32) return 'rock';
  return 'ground';
}

// Динамическая генерация и деструкция 3D чанков земли вокруг игрока
function update3DWorld() {
  const pX = Math.floor(G.p.wx);
  const pY = Math.floor(G.p.wy);
  const currentZone = ZONES[G.zone];
  const keepChunks = new Set();

  // Сканируем область видимости вокруг пилота
  for (let x = pX - VIEW_R; x <= pX + VIEW_R; x++) {
    for (let y = pY - VIEW_R; y <= pY + VIEW_R; y++) {
      const key = `${x},${y}`;
      keepChunks.add(key);

      if (!chunksMap.has(key)) {
        const type = getTileType(x, y);
        let matColor = currentZone.ground;
        let height = 0.01;

        if (type === 'wall') { matColor = currentZone.wall; height = 3.5; }
        else if (type === 'rock') { matColor = currentZone.rock; height = 1.8; }
        else if (type === 'fence') { matColor = currentZone.fence; height = 2.2; }
        else if (type === 'water') { matColor = currentZone.water; height = 0.01; }
        else if (type === 'safe') { matColor = currentZone.safe; }

        let mesh;
        if (height > 0.1) {
          // Для вертикальных стен и препятствий создаем коробку
          const geo = new THREE.BoxGeometry(T_SIZE, height, T_SIZE);
          const mat = new THREE.MeshStandardMaterial({ color: matColor, roughness: 0.7, metalness: 0.1 });
          mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(x * T_SIZE, height / 2, y * T_SIZE);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
        } else {
          // Для плоской земли
          const mat = new THREE.MeshStandardMaterial({ color: matColor, roughness: 0.9 });
          mesh = new THREE.Mesh(GEOS.plane, mat);
          mesh.rotation.x = -Math.PI / 2;
          mesh.position.set(x * T_SIZE, 0, y * T_SIZE);
          mesh.receiveShadow = true;
        }

        scene.add(mesh);
        chunksMap.set(key, mesh);
      }
    }
  }

  // Очищаем старые чанки, ушедшие далеко за радиус обзора, разгружая ОЗУ и видеокарту
  for (const [key, mesh] of chunksMap.entries()) {
    if (!keepChunks.has(key)) {
      scene.remove(mesh);
      if (mesh.geometry) mesh.geometry.dispose();
      if (mesh.material) mesh.material.dispose();
      chunksMap.delete(key);
    }
  }
}

// ═══════════════════════════════════
// PHYSICS & COLLISIONS ENGINE
// ═══════════════════════════════════
function checkCollision(nx, ny, rad = 0.35) {
  // Физический обсчет четырех крайних точек окружности мехи/существа
  const points = [
    { x: nx - rad, y: ny - rad },
    { x: nx + rad, y: ny - rad },
    { x: nx - rad, y: ny + rad },
    { x: nx + rad, y: ny + rad }
  ];
  for (const p of points) {
    const type = getTileType(Math.floor(p.x), Math.floor(p.y));
    if (type === 'wall' || type === 'fence' || type === 'rock' || type === 'water') {
      return true; // Обнаружено твердое препятствие / непроходимая зона
    }
  }
  return false;
}

// ═══════════════════════════════════
// ENTITY RENDERING & MANAGEMENT (3D ADAPTERS)
// ═══════════════════════════════════
function sync3DObjects() {
  const currentEntities = new Set();

  // 1. Синхронизация Монстров
  G.monsters.forEach(m => {
    const id = `mon_${m.id}`;
    currentEntities.add(id);
    let obj = loaded3DObjects.get(id);
    if (!obj) {
      const geo = m.isBoss ? GEOS.box : GEOS.cylinder;
      const mat = m.isBoss ? MATS.boss : MATS.enemy;
      obj = new THREE.Mesh(geo, mat);
      if (m.isBoss) {
        obj.scale.set(2.5, 3.5, 2.5);
      } else {
        obj.scale.set(1, 1.2, 1);
      }
      obj.castShadow = true;
      scene.add(obj);
      loaded3DObjects.set(id, obj);
    }
    obj.position.set(m.x * T_SIZE, m.isBoss ? 1.75 : 0.6, m.y * T_SIZE);
  });

  // 2. Синхронизация Выстрелов (Пуль)
  G.bullets.forEach((b, index) => {
    const id = `bullet_${index}_${b.tx}_${b.ty}`;
    currentEntities.add(id);
    let obj = loaded3DObjects.get(id);
    if (!obj) {
      obj = new THREE.Mesh(GEOS.sphere, MATS.bullet);
      scene.add(obj);
      loaded3DObjects.set(id, obj);
    }
    obj.position.set(b.x * T_SIZE, 0.8, b.y * T_SIZE);
  });

  // 3. Синхронизация Выпавшего Лута (Предметов)
  G.items.forEach(it => {
    const id = `item_${it.id}`;
    currentEntities.add(id);
    let obj = loaded3DObjects.get(id);
    if (!obj) {
      obj = new THREE.Mesh(GEOS.cone, MATS.item);
      obj.rotation.x = Math.PI; // Переворачиваем конус, чтобы он стоял на вершине как кристалл
      scene.add(obj);
      loaded3DObjects.set(id, obj);
    }
    obj.position.set(it.x * T_SIZE, 0.4 + Math.sin(Date.now() * 0.005) * 0.1, it.y * T_SIZE); // Плавное парение предмета в воздухе
    obj.rotation.y += 0.02; // Медленное вращение
  });

  // 4. Синхронизация Турелей Меха
  G.turrets.forEach(tu => {
    const id = `turret_${tu.id}`;
    currentEntities.add(id);
    let obj = loaded3DObjects.get(id);
    if (!obj) {
      obj = new THREE.Mesh(GEOS.box, MATS.turret);
      obj.scale.set(0.6, 1.4, 0.6);
      scene.add(obj);
      loaded3DObjects.set(id, obj);
    }
    obj.position.set(tu.x * T_SIZE, 0.7, tu.y * T_SIZE);
  });

  // 5. Синхронизация Квестовых NPC (Q_GIVERS)
  Q_GIVERS.forEach((qg, index) => {
    const id = `qgiver_${index}`;
    currentEntities.add(id);
    let obj = loaded3DObjects.get(id);
    if (!obj) {
      obj = new THREE.Mesh(GEOS.cylinder, MATS.questgiver);
      obj.scale.set(0.9, 1.3, 0.9);
      scene.add(obj);
      loaded3DObjects.set(id, obj);
    }
    obj.position.set(qg.x * T_SIZE, 0.65, qg.y * T_SIZE);
    obj.rotation.y = Date.now() * 0.0005; // Легкое демонстрационное покачивание
  });

  // Автоматическая зачистка уничтоженных/подобранных сущностей из 3D-сцены
  for (const [id, obj] of loaded3DObjects.entries()) {
    if (!currentEntities.has(id)) {
      scene.remove(obj);
      loaded3DObjects.delete(id);
    }
  }
}

// ═══════════════════════════════════
// RE-SPAWNER & ENGINE STATE TRIGGERS
// ═══════════════════════════════════
function triggerSpawn() {
  if (G.monsters.length >= 25) return; // Ограничиваем плотность врагов на сектор
  const pX = Math.floor(G.p.wx);
  const pY = Math.floor(G.p.wy);
  
  // Спавним монстров за экраном, но в радиусе активности
  const rx = pX + (Math.random() > 0.5 ? 1 : -1) * (8 + Math.floor(Math.random() * 6));
  const ry = pY + (Math.random() > 0.5 ? 1 : -1) * (8 + Math.floor(Math.random() * 6));

  if (getTileType(rx, ry) === 'ground' && !checkCollision(rx, ry, 0.4)) {
    const zoneInfo = ZONES[G.zone];
    const name = zoneInfo.mon[Math.floor(Math.random() * zoneInfo.mon.length)];
    const hp = 25 + G.zone * 40 + Math.floor(Math.random() * 20);
    G.monsters.push({
      id: Math.random().toString(36).substr(2, 9),
      n: name, x: rx, y: ry, hp: hp, mhp: hp,
      s: 1.5 + Math.random() * 0.8, isBoss: false
    });
  }
}

function triggerBossSpawn() {
  const zoneInfo = ZONES[G.zone];
  const pX = Math.floor(G.p.wx) + 6;
  const pY = Math.floor(G.p.wy) + 6;

  if (!checkCollision(pX, pY, 1.2)) {
    const bhp = 350 + G.zone * 600;
    G.monsters.push({
      id: 'boss_' + Date.now(),
      n: zoneInfo.bossName, x: pX, y: pY, hp: bhp, mhp: bhp,
      s: 1.1, isBoss: true
    });
    showNotif(`⚠️ ОБНАРУЖЕН СИГНАЛ БОССА: ${zoneInfo.bossName}!`, true);
  } else {
    // Если точка занята препятствием, пробуем сместить
    G.monsters.push({
      id: 'boss_' + Date.now(),
      n: zoneInfo.bossName, x: G.p.wx - 5, y: G.p.wy - 5, hp: 350 + G.zone * 600, mhp: 350 + G.zone * 600,
      s: 1.1, isBoss: true
    });
    showNotif(`⚠️ ОБНАРУЖЕН СИГНАЛ БОССА: ${zoneInfo.bossName}!`, true);
  }
}
 // ═══════════════════════════════════
// GAME MECHANICS & COMBAT ENGINE
// ═══════════════════════════════════
function fireWeapon(wId, isSecond) {
  const w = WEAPONS[wId];
  if (!w) return;
  
  // Рассчитываем затраты энергии с учетом пассивных навыков/дронов
  let cost = w.e;
  if (G.p.slots.se === 'd2') cost *= 0.88; // Дрон-генератор снижает затраты

  if (G.p.en < cost) return;
  G.p.en -= cost;

  // Ищем ближайшего врага в радиусе поражения орудия
  let rMax = w.r;
  if (G.p.slots.sa === 'a3') rMax += 1.5; // Оптика Квант

  let target = null;
  let minDist = rMax;

  G.monsters.forEach(m => {
    const d = Math.hypot(m.x - G.p.wx, m.y - G.p.wy);
    if (d < minDist) {
      minDist = d;
      target = m;
    }
  });

  if (!target) return;

  // Рассчитываем урон
  let dmg = w.d;
  if (G.p.sk_dmg) dmg *= (1 + G.p.sk_dmg);
  if (G.p.slots.se === 'd4') dmg *= 1.08;
  if (G.p.slots.se === 'd6') dmg *= 1.18;

  // Направление полета пули
  const dx = target.x - G.p.wx;
  const dy = target.y - G.p.wy;
  const dist = Math.hypot(dx, dy);

  G.bullets.push({
    x: G.p.wx, y: G.p.wy,
    vx: (dx / dist) * 12, vy: (dy / dist) * 12, // Скорость полета пули
    dmg: dmg, tx: target.x, ty: target.y, t: w.t
  });

  psh(w.t); // Воспроизведение звука выстрела через Web Audio API
}

function damagePlayer(amt) {
  G.p.hp -= amt;
  if (G.p.hp <= 0) {
    G.p.hp = 0;
    showNotif("🚨 ВАШ МЕХ УНИЧТОЖЕН! Респавн на базе...", true);
    G.p.wx = SPAWN_X;
    G.p.wy = SPAWN_Y;
    G.p.hp = G.p.mhp;
    G.p.en = G.p.men;
    G.p.cr = Math.max(0, G.p.cr - 150); // Штраф за уничтожение
    saveGame();
  }
}

function showNotif(txt, isAlert = false) {
  const n = document.getElementById('notif');
  n.innerText = txt;
  n.style.background = isAlert ? 'rgba(150,20,20,0.9)' : 'rgba(30,40,20,0.9)';
  n.style.borderColor = isAlert ? '#ff3333' : '#a0b040';
  n.classList.add('show');
  setTimeout(() => n.classList.remove('show'), 3000);
}

function updateHUD() {
  document.getElementById('v_lvl').innerText = G.p.lvl;
  document.getElementById('v_cr').innerText = G.p.cr;
  document.getElementById('v_hp').innerText = Math.ceil(G.p.hp);
  document.getElementById('v_mhp').innerText = G.p.mhp;
  document.getElementById('v_en').innerText = Math.ceil(G.p.en);
  document.getElementById('v_men').innerText = G.p.men;
  
  const hPct = Math.min(100, Math.max(0, (G.p.hp / G.p.mhp) * 100));
  document.getElementById('p_hp').style.width = `${hPct}%`;
  
  const ePct = Math.min(100, Math.max(0, (G.p.en / G.p.men) * 100));
  document.getElementById('p_en').style.width = `${ePct}%`;

  const reqXp = G.p.lvl * 250;
  const xPct = Math.min(100, (G.p.xp / reqXp) * 100);
  document.getElementById('p_xp').style.width = `${xPct}%`;

  const zn = ZONES[G.zone];
  const zBtn = document.getElementById('b_zone');
  zBtn.innerText = zn.name;
  zBtn.style.color = zn.acc;
  
  // Проверяем нахождение в безопасной зоне
  const inSafe = (G.p.wx >= SZ_X && G.p.wx < SZ_X + SZ_W && G.p.wy >= SZ_Y && G.p.wy < SZ_Y + SZ_H);
  const locText = document.getElementById('v_loc');
  if (inSafe) {
    locText.innerText = "АВАНПОСТ";
    locText.style.color = "#55ff55";
  } else {
    locText.innerText = "ДИКИЙ СЕКТОР";
    locText.style.color = "#ff5555";
  }
}

    cnt.innerHTML = h;
  }
}

// ═══════════════════════════════════
// BUTTON TRIGGER FUNCTIONS (RECEPTORS)
// ═══════════════════════════════════
function selectTab(t) {
  activeTab = t;
  document.querySelectorAll('#tabs .tab').forEach(el => el.classList.remove('act'));
  const targetBtn = Array.from(document.querySelectorAll('#tabs .tab')).find(el => el.getAttribute('onclick').includes(t));
  if (targetBtn) targetBtn.classList.add('act');
  renderPanel();
}

function toggleAuto() {
  G.auto = !G.auto;
  const btn = document.getElementById('b_auto');
  btn.innerText = G.auto ? 'АВТО: ВКЛ' : 'АВТО: ВЫКЛ';
  btn.style.borderColor = G.auto ? '#00ff88' : '#5a6020';
}

function cycleZone() {
  G.zone = (G.zone + 1) % ZONES.length;
  // Очищаем сущности старой зоны
  G.monsters.forEach(m => { if (loaded3DObjects.has(`mon_${m.id}`)) scene.remove(loaded3DObjects.get(`mon_${m.id}`)); });
  G.items.forEach(it => { if (loaded3DObjects.has(`item_${it.id}`)) scene.remove(loaded3DObjects.get(`item_${it.id}`)); });
  G.monsters = [];
  G.items = [];
  G.bullets = [];
  
  // Принудительно перегенерируем 3D ландшафт
  for (const [k, m] of chunksMap.entries()) { scene.remove(m); }
  chunksMap.clear();
  
  showNotif(`Вход в сектор: ${ZONES[G.zone].name}`);
  update3DWorld();
  updateHUD();
  if (activeTab === 'quests') renderPanel();
}

function useInventoryItem(id) {
  if (WEAPONS[id]) {
    G.p.w2 = id;
    showNotif(`Второе орудие установлено: ${WEAPONS[id].n}`);
  } else if (DRONES[id]) {
    const d = DRONES[id];
    if (d.t === 'def') G.p.slots.sw = id;
    else G.p.slots.se = id;
    showNotif(`Дрон активирован: ${d.n}`);
  } else if (AUX[id]) {
    G.p.slots.sa = id;
    showNotif(`Доп. модуль смонтирован: ${AUX[id].n}`);
  }
  renderPanel();
}

function sellItem(id) {
  if ((G.p.inv[id] || 0) > 0) {
    G.p.inv[id]--;
    G.p.cr += LOOT_P[id] || 10;
    showNotif(`Продано: ${id} (+${LOOT_P[id] || 10}⛃)`);
    renderPanel();
    updateHUD();
  }
}

function buyShopItem(type, id, price, rLvl) {
  if (G.p.cr < price) return showNotif("Недостаточно кредитов!", true);
  if (G.p.lvl < rLvl) return showNotif(`Требуется уровень пилота ${rLvl}!`, true);
  
  G.p.cr -= price;
  G.p.inv[id] = (G.p.inv[id] || 0) + 1;
  showNotif("Оборудование куплено и доставлено на склад!");
  renderPanel();
  updateHUD();
}

function craftItem(resId, hasCr, reqJson) {
  if (!hasCr) return showNotif("Требуется 100 кредитов для калибровки верстака!", true);
  const req = JSON.parse(decodeURIComponent(reqJson));
  
  for (const [mat, qty] of Object.entries(req)) {
    if ((G.p.inv[mat] || 0) < qty) return showNotif("Сборка отменена: нехватка материалов!", true);
  }

  // Списываем компоненты
  for (const [mat, qty] of Object.entries(req)) { G.p.inv[mat] -= qty; }
  G.p.cr -= 100;
  G.p.inv[resId] = (G.p.inv[resId] || 0) + 1;
  
  showNotif(`Успешный крафт: Собрано ${resId}!`);
  renderPanel();
  updateHUD();
}

function upgradeSkill(id) {
  if (G.p.skPoints <= 0) return;
  G.p.skPoints--;
  G.p.skills[id] = (G.p.skills[id] || 0) + 1;
  SKILLS[id].f(G.p); // Применяем эффект перка мгновенно
  showNotif(`Процессор обновлен: ${SKILLS[id].n}`);
  renderPanel();
  updateHUD();
}

function acceptQuest(id) {
  if (curQ) return showNotif("Вы уже выполняете один контракт!", true);
  const q = QUESTS_DB.find(x => x.id === id);
  if (!q) return;
  curQ = { ...q, cc: 0 };
  showNotif(`Взят контракт: ${q.n}. Выполняйте!`);
  renderPanel();
}

function completeActiveQuest() {
  if (!curQ || curQ.cc < curQ.req) return;
  G.p.cr += curQ.rCr;
  G.p.xp += curQ.rXp;
  showNotif(`Контракт выполнен! +${curQ.rCr}⛃ +${curQ.rXp}XP`);
  curQ = null;
  
  // Проверка левелапа игрока
  const reqXp = G.p.lvl * 250;
  if (G.p.xp >= reqXp) {
    G.p.xp -= reqXp;
    G.p.lvl++;
    G.p.skPoints++;
    showNotif(`🎉 ПОВЫШЕНИЕ РАНГА ПИЛОТА: УРОВЕНЬ ${G.p.lvl}! Начислено Очко Модернизации.`, false);
  }
  
  renderPanel();
  updateHUD();
  saveGame();
}

function unequipW2() {
  if (G.p.w2) {
    G.p.inv[G.p.w2] = (G.p.inv[G.p.w2] || 0) + 1;
    G.p.w2 = null;
    showNotif("Второе орудие демонтировано.");
    renderPanel();
  }
}

function unequipSlot(slot) {
  const item = G.p.slots[slot];
  if (item) {
    G.p.inv[item] = (G.p.inv[item] || 0) + 1;
    G.p.slots[slot] = null;
    showNotif("Модуль перенесен на склад.");
    renderPanel();
  }
}

// ═══════════════════════════════════
// MAIN GAME LOOP (3D & LOGIC TICKER)
// ═══════════════════════════════════
let lastW1Fire = 0;
let lastW2Fire = 0;
let lastRegenTime = 0;
let lastSpawnTime = 0;

function gameTick(timestamp) {
  if (!G.isRun) return;
  requestAnimationFrame(gameTick);

  const dt = (timestamp - G.lastTime) / 1000;
  G.lastTime = timestamp;

  if (dt > 0.5) return; // Исключаем скачки при сворачивании вкладки браузера

  // 1. Управление вектором перемещения Меха игрока
  if (G.jd.x !== 0 || G.jd.y !== 0) {
    const speed = 4.2 * dt; // Скорость перемещения
    const nx = G.p.wx + G.jd.x * speed;
    const ny = G.p.wy + G.jd.y * speed;

    if (!checkCollision(nx, G.p.wy, 0.35)) G.p.wx = nx;
    if (!checkCollision(G.p.wx, ny, 0.35)) G.p.wy = ny;

    // Поворачиваем 3D-модель меха по направлению его хода
    if (playerMesh) {
      const angle = Math.atan2(-G.jd.y, G.jd.x) + Math.PI / 2;
      playerMesh.rotation.y = angle;
    }
  }

  // Привязываем 3D позицию меха к его логическим координатам
  if (playerMesh) {
    playerMesh.position.set(G.p.wx * T_SIZE, 0, G.p.wy * T_SIZE);
    // Плавное следование камеры за роботом в изометрии
    camera.position.set(G.p.wx * T_SIZE, 18, G.p.wy * T_SIZE + 12);
    camera.lookAt(playerMesh.position);
  }

  // 2. Обновление мира и чанков вокруг игрока
  update3DWorld();

  // 3. Автоматическая стрельба во время боя
  const now = Date.now();
  let cdMod = 1.0;
  if (G.p.slots.se === 'd3') cdMod *= 0.90; // Модуль ИИ ускоряет перезарядку

  if (G.auto) {
    const w1Data = WEAPONS[G.p.w1];
    if (w1Data && now - lastW1Fire >= w1Data.cd * cdMod) {
      fireWeapon(G.p.w1, false);
      lastW1Fire = now;
    }
    if (G.p.w2) {
      const w2Data = WEAPONS[G.p.w2];
      if (w2Data && now - lastW2Fire >= w2Data.cd * cdMod) {
        fireWeapon(G.p.w2, true);
        lastW2Fire = now;
      }
    }
  }

  // 4. Поведение Снарядов / Пуль в 3D пространстве
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // Проверяем коллизии пули со стенами мира
    if (getTileType(Math.floor(b.x), Math.floor(b.y)) === 'wall') {
      G.bullets.splice(i, 1);
      continue;
    }

    // Проверяем попадание во врагов
    let hit = false;
    for (let j = G.monsters.length - 1; j >= 0; j--) {
      const m = G.monsters[j];
      const radius = m.isBoss ? 1.2 : 0.45;
      if (Math.hypot(m.x - b.x, m.y - b.y) < radius) {
        m.hp -= b.dmg;
        hit = true;
        G.bullets.splice(i, 1);

        if (m.hp <= 0) {
          // Моб уничтожен! Начисление наград
          const xpGained = m.isBoss ? (150 + G.zone * 200) : (15 + G.zone * 15);
          const crGained = m.isBoss ? (400 + G.zone * 500) : (12 + G.zone * 15);
          G.p.xp += xpGained;
          G.p.cr += crGained;

          // Засчитываем в текущий контракт квеста
          if (curQ) {
            if (curQ.t === 'kill') { curQ.cc++; if (activeTab === 'quests') renderPanel(); }
            else if (curQ.t === 'kill_type' && m.n === curQ.tgt) { curQ.cc++; if (activeTab === 'quests') renderPanel(); }
          }

          // Выпадение лута (материалов) на поле боя
          const zoneInfo = ZONES[G.zone];
          const lootName = m.isBoss ? zoneInfo.bossLoot[Math.floor(Math.random() * zoneInfo.bossLoot.length)] : zoneInfo.loot[Math.floor(Math.random() * zoneInfo.loot.length)];
          
          G.items.push({
            id: Math.random().toString(36).substr(2, 9),
            n: lootName, x: m.x, y: m.y
          });

          showNotif(`Уничтожен: ${m.n} (+${crGained}⛃)`);
          G.monsters.splice(j, 1);
          
          // Проверка Левелапа пилота
          const reqXp = G.p.lvl * 250;
          if (G.p.xp >= reqXp) {
            G.p.xp -= reqXp;
            G.p.lvl++;
            G.p.skPoints++;
            showNotif(`🎉 РАНГ ПИЛОТА ПОВЫШЕН: УРОВЕНЬ ${G.p.lvl}!`, false);
          }
          updateHUD();
        }
        break;
      }
    }
    
    // Удаляем пули, улетевшие слишком далеко от пилота (оптимизация сцены)
    if (!hit && Math.hypot(b.x - G.p.wx, b.y - G.p.wy) > 25) {
      G.bullets.splice(i, 1);
    }
  }

  // 5. Поведение ИИ Монстров (Преследование меха)
  G.monsters.forEach(m => {
    const dist = Math.hypot(G.p.wx - m.x, G.p.wy - m.y);
    const inSafe = (m.x >= SZ_X && m.x < SZ_X + SZ_W && m.y >= SZ_Y && m.y < SZ_Y + SZ_H);
    
    if (dist < 15 && !inSafe) { // Монстры преследуют игрока, если он вышел из Аванпоста
      const dx = G.p.wx - m.x;
      const dy = G.p.wy - m.y;
      const nx = m.x + (dx / dist) * m.s * dt;
      const ny = m.y + (dy / dist) * m.s * dt;

      if (!checkCollision(nx, m.y, m.isBoss ? 1.0 : 0.4)) m.x = nx;
      if (!checkCollision(m.x, ny, m.isBoss ? 1.0 : 0.4)) m.y = ny;

      // Нанесение урона меху в ближнем бою
      const attackDist = m.isBoss ? 1.4 : 0.65;
      if (dist < attackDist) {
        damagePlayer((m.isBoss ? 28 : 6) * dt);
        updateHUD();
      }
    }
  });

  // 6. Сбор выпавшего лута при наезде корпуса
  for (let i = G.items.length - 1; i >= 0; i--) {
    const it = G.items[i];
    if (Math.hypot(it.x - G.p.wx, it.y - G.p.wy) < 0.8) {
      G.p.inv[it.n] = (G.p.inv[it.n] || 0) + 1;
      showNotif(`Подобран материал: ${it.n}`);
      
      if (curQ && curQ.t === 'loot' && it.n === curQ.tgt) {
        curQ.cc = G.p.inv[it.n];
        if (activeTab === 'quests') renderPanel();
      }

      G.items.splice(i, 1);
      if (activeTab === 'inv') renderPanel();
    }
  }

  // 7. Пассивная ежесекундная регенерация HP и энергии реактора
  if (now - lastRegenTime >= 1000) {
    let hpReg = G.p.sk_hpreg || 0;
    let enReg = 2.5 + (G.p.sk_enreg || 0); // Базовый энергокамбэк реактора

    if (G.p.slots.sa === 'a1') hpReg += 1.0;
    if (G.p.slots.sa === 'a4') hpReg += 3.0;
    if (G.p.slots.sa === 'a2') enReg += 1.0;
    if (G.p.slots.sa === 'a5') enReg += 4.0;

    // В безопасной зоне регенерация ускорена в 4 раза
    const isSafe = (G.p.wx >= SZ_X && G.p.wx < SZ_X + SZ_W && G.p.wy >= SZ_Y && G.p.wy < SZ_Y + SZ_H);
    if (isSafe) { hpReg += 15.0; enReg += 20.0; }

    G.p.hp = Math.min(G.p.mhp, G.p.hp + hpReg);
    G.p.en = Math.min(G.p.men, G.p.en + enReg);
    
    updateHUD();
    lastRegenTime = now;
  }

  // 8. Таймер динамического спавна новых мобов в секторе
  if (now - lastSpawnTime >= 2500) {
    triggerSpawn();
    lastSpawnTime = now;
  }

  // 9. Отрисовка всех объектов на 3D сцене Three.js
  sync3DObjects();
  renderer.render(scene, camera);
}

// ═══════════════════════════════════
// INITIALIZATION AND START TRIGGERS
// ═══════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  // Проверяем наличие старых сохранений пилота в LocalStorage
  const saved = loadGame();
  if (saved && saved.p) {
    G.p = { ...G.p, ...saved.p };
    G.zone = saved.zone || 0;
  }

  // Разворачиваем 3D подсистему WebGL
  init3DEngine();

  // Запуск главного ядра
  G.isRun = true;
  G.lastTime = performance.now();
  requestAnimationFrame(gameTick);

  // Отрендерить дефолтные показатели интерфейсов
  updateHUD();
  selectTab('inv');

  showNotif("ДОБРО ПОЖАЛОВАТЬ В IRON WASTES 3D! СИСТЕМЫ МЕХА СТАБИЛЬНЫ.");
});
