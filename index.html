<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>IRON WASTES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a0e;touch-action:none}
#root{width:100%;height:100dvh;display:flex;flex-direction:column;font-family:'Segoe UI',Arial,sans-serif}

/* ── HUD ── */
#hud{display:flex;align-items:center;padding:5px 10px;
  background:linear-gradient(180deg,#1e2010 0%,#141608 100%);
  border-bottom:2px solid #5a6020;flex-shrink:0;gap:6px;min-height:42px}
.hs{display:flex;flex-direction:column;align-items:center;min-width:36px}
.hl{font-size:7px;color:#8a9040;letter-spacing:.5px;text-transform:uppercase;font-family:'Courier New',monospace}
.hv{font-size:11px;color:#d4c040;font-weight:bold;line-height:1;text-shadow:0 0 8px #d4c04088}
.brow{display:flex;align-items:center;gap:4px;flex:1}
.blab{font-size:7px;color:#8a9040;width:14px;flex-shrink:0;font-family:'Courier New',monospace}
.bwrap{flex:1;height:9px;background:#0a0c04;border:1px solid #3a4010;border-radius:4px;overflow:hidden;min-width:36px;box-shadow:inset 0 1px 3px #00000088}
.bhp{height:100%;background:linear-gradient(90deg,#205810,#40b020,#60e030);border-radius:4px;transition:width .12s}
.ben{height:100%;background:linear-gradient(90deg,#102858,#2060b0,#40a0e0);border-radius:4px;transition:width .12s}

/* ── CANVAS AREA ── */
#cw{flex:1;position:relative;overflow:hidden}
#gc{display:block;width:100%;height:100%}

/* ── BOSS BAR ── */
#bbar{position:absolute;bottom:0;left:0;right:0;height:30px;
  background:linear-gradient(180deg,#200000aa,#3a0000cc);
  border-top:2px solid #aa0000;display:none;align-items:center;padding:0 12px;gap:10px;z-index:10}
.bbn{font-size:9px;color:#ff5050;letter-spacing:1px;min-width:110px;text-transform:uppercase;font-family:'Courier New',monospace;text-shadow:0 0 8px #ff5050}
.bbw{flex:1;height:11px;background:#1a0000;border:1px solid #880000;border-radius:4px;overflow:hidden;box-shadow:inset 0 1px 3px #000}
.bbf{height:100%;background:linear-gradient(90deg,#880000,#ff3000,#ff5020);border-radius:4px;transition:width .15s}

/* ── NOTIF ── */
#notif{position:absolute;top:8px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#2a2800ee,#1a1800ee);
  border:1px solid #d4c040;color:#f0e060;font-size:10px;padding:5px 16px;
  border-radius:20px;pointer-events:none;opacity:0;transition:opacity .3s;
  white-space:nowrap;z-index:300;max-width:94%;
  box-shadow:0 4px 20px #d4c04033,0 0 0 1px #00000044;font-family:'Courier New',monospace}

/* ── CONTROLS ── */
#ctrl{display:flex;align-items:flex-end;justify-content:space-between;
  padding:6px 12px 10px;
  padding-bottom:max(10px,env(safe-area-inset-bottom,10px));
  background:linear-gradient(0deg,rgba(10,12,4,.92) 0%,rgba(18,20,8,.7) 100%);
  border-top:1px solid rgba(90,96,32,.4);flex-shrink:0;position:relative;height:130px}

/* LEFT: two weapon slot squares */
#wslots{display:flex;flex-direction:column;gap:6px;justify-content:flex-end;padding-bottom:4px}
.wslot-btn{width:58px;height:58px;border-radius:14px;cursor:pointer;border:none;
  -webkit-appearance:none;display:flex;flex-direction:column;align-items:center;
  justify-content:center;position:relative;transition:transform .08s,box-shadow .08s;
  overflow:hidden}
.wslot-btn.ws1{background:linear-gradient(145deg,#5a2808,#2a1004);
  box-shadow:0 4px 14px #c0401077,0 2px 0 #401008,inset 0 1px 0 #ffffff44,0 0 0 2px #c04010}
.wslot-btn.ws2{background:linear-gradient(145deg,#083060,#041830);
  box-shadow:0 4px 14px #1060a077,0 2px 0 #042040,inset 0 1px 0 #ffffff44,0 0 0 2px #1060a0}
.wslot-btn.wempty{background:linear-gradient(145deg,#1e2010,#0e1008);
  box-shadow:0 2px 8px #00000055,0 0 0 2px #3a4018;opacity:.6}
.wslot-btn.lit{transform:scale(.9);box-shadow:0 1px 4px #00000099}
.wslot-btn:active{transform:scale(.9)}
.ws-icon{font-size:22px;line-height:1}
.ws-name{font-size:6px;color:#ffffffcc;font-family:'Courier New',monospace;letter-spacing:.3px;
  max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.ws-badge{position:absolute;top:3px;right:3px;font-size:6px;background:#000000aa;
  color:#ffffff;padding:1px 3px;border-radius:4px;font-family:'Courier New',monospace}

/* CENTER: transparent joystick */
#jpad{width:120px;height:120px;position:absolute;left:50%;transform:translateX(-50%);
  bottom:8px;touch-action:none;z-index:5}
#jbase{width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.06) 0%,rgba(255,255,255,.02) 60%,transparent 100%);
  border:2px solid rgba(255,255,255,.18);position:absolute;top:5px;left:5px;
  box-shadow:inset 0 2px 12px rgba(0,0,0,.3)}
#jknob{width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(255,255,255,.12));
  border:2px solid rgba(255,255,255,.5);position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 2px 12px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.1)}

/* RIGHT: autobattle toggle */
#rightcol{display:flex;flex-direction:column;gap:6px;justify-content:flex-end;padding-bottom:4px;align-items:center}
#auto-btn{width:58px;height:58px;border-radius:14px;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  -webkit-appearance:none;transition:transform .1s,box-shadow .1s;font-family:'Courier New',monospace}
#auto-btn.off{background:linear-gradient(145deg,#2a2c18,#14160a);
  box-shadow:0 3px 10px #00000055,0 0 0 2px #4a5018;color:#6a7030}
#auto-btn.on{background:linear-gradient(145deg,#206040,#0c3020);
  box-shadow:0 4px 14px #20a06077,0 2px 0 #0c3020,0 0 0 2px #30c060,0 0 16px #30c06055;color:#60f080}
.auto-icon{font-size:22px;line-height:1}
.auto-label{font-size:7px;letter-spacing:.5px;font-weight:bold}
/* HUD top-right buttons */
#hud-btns{display:flex;gap:5px;margin-left:auto}
.hud-btn{padding:4px 9px;border:none;border-radius:8px;font-size:9px;cursor:pointer;
  font-family:'Courier New',monospace;font-weight:bold;-webkit-appearance:none;transition:transform .08s}
.hud-btn:active{transform:scale(.93)}
.hb-s{color:#fff;background:linear-gradient(135deg,#408020,#205010);box-shadow:0 2px 6px #40802044}
.hb-m{color:#fff;background:linear-gradient(135deg,#906010,#503010);box-shadow:0 2px 6px #90601044}
/* Big map overlay */
#bigmap{position:absolute;inset:0;background:rgba(0,0,0,.88);z-index:90;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:8px}
#bigmap-canvas{border-radius:8px;border:2px solid #5a6020;box-shadow:0 0 30px #00000088}
.bm-close{padding:8px 24px;border:none;background:linear-gradient(135deg,#a07010,#604010);color:#fff;
  font-family:'Courier New',monospace;font-size:11px;border-radius:8px;cursor:pointer;letter-spacing:1px}

/* ── START OVERLAY ── */
#overlay-start{position:absolute;inset:0;
  background:radial-gradient(ellipse at center,#1a200a 0%,#080a04 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:100}
.ov-t{font-size:28px;color:#d4c040;letter-spacing:6px;
  text-shadow:0 0 40px #d4c04099,0 2px 0 #60500a;font-family:'Courier New',monospace}
.ov-s{font-size:9px;color:#8a9040;letter-spacing:3px;font-family:'Courier New',monospace}
.ov-btn{padding:14px 36px;border:none;color:#fff;font-weight:bold;
  background:linear-gradient(135deg,#a07010,#604010);
  font-family:'Courier New',monospace;font-size:13px;letter-spacing:2px;
  cursor:pointer;border-radius:12px;
  box-shadow:0 6px 24px #a0701066,0 2px 0 #402008,inset 0 1px 0 #ffffff44}

/* ── LEVEL UP ── */
#overlay-lvl{position:absolute;inset:0;background:#000000ee;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:120;padding:16px}
.sk-btn{width:220px;padding:12px 16px;border:none;
  background:linear-gradient(135deg,#2a2c18,#1a1c0c);
  color:#e0d090;font-family:'Courier New',monospace;font-size:10px;border-radius:10px;
  cursor:pointer;text-align:left;
  box-shadow:0 4px 12px #00000066,0 1px 0 #ffffff1a,inset 0 1px 0 #ffffff18}
.sk-btn:active{transform:scale(.97)}

/* ── PANEL (inventory/mech/shop) ── */
#panel{position:absolute;inset:0;
  background:linear-gradient(180deg,#f4f0e0 0%,#e8e4d0 100%);
  display:none;flex-direction:column;z-index:80}
#ptabs{display:flex;background:linear-gradient(180deg,#ffffff,#e8e4d0);
  border-bottom:2px solid #c8b870;flex-shrink:0;
  box-shadow:0 2px 8px #00000022}
.ptab{flex:1;padding:12px 4px;font-size:10px;font-family:'Courier New',monospace;
  color:#8a7840;background:transparent;border:none;
  border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;letter-spacing:.5px;font-weight:bold}
.ptab.on{color:#604010;border-bottom-color:#a07010;background:linear-gradient(180deg,#fff8e0,transparent)}
.pcx{color:#c04010;font-size:16px;cursor:pointer;padding:8px 14px;
  flex-shrink:0;background:none;border:none;font-weight:bold}
#pbody{flex:1;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch;background:transparent}
.psec{font-size:9px;color:#604010;letter-spacing:2px;margin:10px 0 6px;
  text-transform:uppercase;font-weight:bold;font-family:'Courier New',monospace;
  border-bottom:2px solid #c8b870;padding-bottom:4px}

/* ITEM CARD — 3D card look */
.icard{background:linear-gradient(135deg,#ffffff,#f4f0e0);
  border:1px solid #d4c890;border-radius:12px;padding:10px 12px;margin-bottom:8px;
  position:relative;cursor:pointer;
  box-shadow:0 4px 12px #00000018,0 1px 0 #ffffff99,inset 0 1px 0 #ffffffcc;
  transition:transform .1s,box-shadow .1s}
.icard:active{transform:scale(.97);box-shadow:0 1px 4px #00000022}
.icard.owned{border-color:#80a040;background:linear-gradient(135deg,#f0f8e0,#e8f0d0)}
.icard.locked{opacity:.45;cursor:default}
.iname{font-size:11px;color:#302010;font-weight:bold}
.istat{font-size:8px;color:#6a5830;margin-top:3px;line-height:1.5}
.iprice{font-size:10px;color:#806020;margin-top:4px;font-weight:bold}
.ilvl{position:absolute;top:8px;right:8px;font-size:8px;padding:2px 6px;border-radius:8px;font-weight:bold}
.ok{background:linear-gradient(135deg,#e0f0c0,#c8e0a0);color:#406020;border:1px solid #80b040}
.no{background:linear-gradient(135deg,#f0d0c0,#e0b0a0);color:#803020;border:1px solid #c06040}

/* INV ROW */
.invrow{background:linear-gradient(135deg,#ffffff,#f4f0e0);border:1px solid #d4c890;
  border-radius:10px;padding:8px 12px;margin-bottom:5px;display:flex;align-items:center;gap:8px;
  box-shadow:0 2px 6px #00000012,inset 0 1px 0 #ffffffcc}
.irvname{flex:1;font-size:10px;color:#302010;font-weight:bold}
.irvstat{font-size:8px;color:#6a5830}
.irvbtn{font-size:8px;padding:5px 10px;border:none;border-radius:6px;cursor:pointer;margin-left:4px;font-weight:bold;font-family:'Courier New',monospace}
.ebtn{color:#fff;background:linear-gradient(135deg,#508030,#306010);box-shadow:0 2px 4px #50803044}
.sbtn{color:#fff;background:linear-gradient(135deg,#908030,#604010);box-shadow:0 2px 4px #90803044}

/* MECH SLOTS */
.mslot{width:76px;height:66px;border-radius:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:8px;text-align:center;padding:4px;font-family:'Courier New',monospace;
  transition:transform .1s;box-shadow:0 4px 12px #00000022,inset 0 1px 0 #ffffff44}
.mslot:active{transform:scale(.95)}
.sw{background:linear-gradient(135deg,#fff0e0,#f0d0b0);border:2px solid #c06020;color:#803010}
.se{background:linear-gradient(135deg,#e0f0ff,#c0d8f0);border:2px solid #2060a0;color:#103060}
.sa{background:linear-gradient(135deg,#f8f0d0,#e8d8a0);border:2px solid #906020;color:#604010}
</style>
</head>
<body>
<div id="root">
<!-- HUD -->
<div id="hud">
  <div class="hs"><span class="hl">LVL</span><span class="hv" id="h-lvl">1</span></div>
  <div style="flex:1;display:flex;flex-direction:column;gap:3px;margin:0 6px">
    <div class="brow"><span class="blab">HP</span><div class="bwrap"><div class="bhp" id="bhp"></div></div><span style="font-size:8px;color:#60d030;min-width:42px;text-align:right;font-family:'Courier New',monospace" id="h-hp">100/100</span></div>
    <div class="brow"><span class="blab">EN</span><div class="bwrap"><div class="ben" id="ben"></div></div><span style="font-size:8px;color:#40a0e0;min-width:42px;text-align:right;font-family:'Courier New',monospace" id="h-en">60/60</span></div>
  </div>
  <div class="hs"><span class="hl">XP</span><span class="hv" id="h-xp">0</span></div>
  <div class="hs"><span class="hl">CR</span><span class="hv" id="h-cr">500</span></div>
  <div id="hud-btns">
    <button class="hud-btn hb-s" onclick="op('shop')">🏪</button>
    <button class="hud-btn hb-m" onclick="op('mech')">⚙</button>
    <button class="hud-btn hb-m" onclick="op('inv')" style="background:linear-gradient(135deg,#304888,#182040);box-shadow:0 2px 6px #30488844">📦</button>
  </div>
</div>

<!-- CANVAS -->
<div id="cw">
  <canvas id="gc" onclick="handleCanvasClick(event)"></canvas>
  <div id="notif"></div>
  <div id="bbar"><span class="bbn" id="bbn">BOSS</span><div class="bbw"><div class="bbf" id="bbf"></div></div><span style="font-size:9px;color:#ff5050;font-family:'Courier New',monospace" id="bht">???</span></div>
  <!-- BIGMAP -->
  <div id="bigmap">
    <canvas id="bigmap-canvas"></canvas>
    <button class="bm-close" onclick="closeBigmap()">✕ ЗАКРЫТЬ</button>
  </div>

  <!-- START -->
  <div id="overlay-start">
    <div class="ov-t">⚙ IRON WASTES ⚙</div>
    <div class="ov-s">MEX WARS // v5.0 — SAFE ZONE UPDATE</div>
    <div style="font-size:9px;color:#506020;margin:2px 0">Безопасная зона · Турели · Чемпионы · Сохранение</div>
    <div style="font-size:9px;color:#8a9040;text-align:center;line-height:2;margin-bottom:4px;font-family:'Courier New',monospace">
      Джойстик — движение | SLOT1/SLOT2 — огонь<br>SHOP у торговца | MECH / INV — меню
    </div>
    <button class="ov-btn" onclick="startGame()">[ ЗАПУСТИТЬ МЕХ ]</button>
    <div id="save-info" style="font-size:9px;color:#8a9040;margin-top:4px;font-family:'Courier New',monospace"></div>
  </div>

  <!-- LEVEL UP -->
  <div id="overlay-lvl">
    <div style="font-size:16px;color:#d4c040;letter-spacing:2px;font-family:'Courier New',monospace;text-shadow:0 0 20px #d4c04088">▲ LEVEL UP!</div>
    <div style="font-size:10px;color:#a0a060;font-family:'Courier New',monospace">Выбери навык:</div>
    <div id="skc" style="display:flex;flex-direction:column;gap:5px"></div>
    <div style="font-size:9px;color:#808050;font-family:'Courier New',monospace" id="skpts"></div>
  </div>

  <!-- PANEL -->
  <div id="panel">
    <div id="ptabs">
      <button class="ptab on" id="t-inv" onclick="sw('inv')">📦 ИНВЕНТАРЬ</button>
      <button class="ptab" id="t-mech" onclick="sw('mech')">⚙ МЕХ</button>
      <button class="ptab" id="t-shop" onclick="sw('shop')">🏪 МАГАЗИН</button>
      <button class="pcx" onclick="cp()">✕</button>
    </div>
    <div id="pbody"></div>
  </div>
</div>

<!-- CONTROLS -->
<div id="ctrl">
  <!-- LEFT: weapon slots -->
  <div id="wslots">
    <button class="wslot-btn ws1 wempty" id="wb1" ontouchstart="ft(0,event)" onclick="ft(0,null)">
      <span class="ws-icon" id="wi1">⚫</span>
      <span class="ws-name" id="wn1">ПУСТО</span>
    </button>
    <button class="wslot-btn ws2 wempty" id="wb2" ontouchstart="ft(1,event)" onclick="ft(1,null)">
      <span class="ws-icon" id="wi2">⚫</span>
      <span class="ws-name" id="wn2">ПУСТО</span>
    </button>
  </div>
  <!-- CENTER: transparent joystick -->
  <div id="jpad"><div id="jbase"><div id="jknob"></div></div></div>
  <!-- RIGHT: autobattle -->
  <div id="rightcol">
    <button id="auto-btn" class="off" onclick="toggleAuto()">
      <span class="auto-icon">🤖</span>
      <span class="auto-label" id="auto-lbl">АВТО</span>
      <span style="font-size:8px" id="auto-state">ВЫКЛ</span>
    </button>
  </div>
</div>
</div>
<script>
// ═══════════════════════════════════
// AUDIO
// ═══════════════════════════════════
let AC=null;
function ia(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function psh(tp){ia();if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);const t=AC.currentTime;if(tp==='ballistic'){o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(55,t+.09);g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.start(t);o.stop(t+.1);}else if(tp==='energy'){o.type='sine';o.frequency.setValueAtTime(1200,t);o.frequency.exponentialRampToValueAtTime(500,t+.07);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);o.start(t);o.stop(t+.07);}else{o.type='triangle';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(35,t+.17);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.18);}}catch(e){}}

// ═══════════════════════════════════
// SAVE
// ═══════════════════════════════════
function saveGame(){try{localStorage.setItem('iw_s',JSON.stringify({p:G.p,zone:G.zone,ts:Date.now()}));}catch(e){}}
function loadGame(){try{const r=localStorage.getItem('iw_s');return r?JSON.parse(r):null;}catch(e){return null;}}

// ═══════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════
const WW=1000,WH=1000,PPT=32,VIEW_R=28,AI_FULL=20,AI_LITE=50;
// Safe zone (center 50,50 to 65,65)
const SZ_X=44,SZ_Y=44,SZ_W=16,SZ_H=16; // safe zone tiles
const SZ_CX=SZ_X+SZ_W/2,SZ_CY=SZ_Y+SZ_H/2;
const SPAWN_X=52,SPAWN_Y=52; // player spawn inside safe zone

// ═══════════════════════════════════
// TERRAIN
// ═══════════════════════════════════
function noise2(x,y,s){const n=Math.sin(x*127.1+y*311.7+s*754.3)*43758.5453;return n-Math.floor(n);}
function smN(x,y,s){const fx=Math.floor(x),fy=Math.floor(y),tx=x-fx,ty=y-fy;const a=noise2(fx,fy,s),b=noise2(fx+1,fy,s),c=noise2(fx,fy+1,s),d=noise2(fx+1,fy+1,s);return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty;}

function baseTerrainAt(tx,ty,zone){
  // FLAT OPEN area in center (radius 80 from spawn)
  const dx=tx-SPAWN_X,dy=ty-SPAWN_Y;
  const d=Math.sqrt(dx*dx+dy*dy);
  if(d<80)return'ground';

  const n=smN(tx*.04,ty*.04,zone*100)+smN(tx*.12,ty*.12,zone*200)*.35+smN(tx*.3,ty*.3,zone*300)*.15;
  const rx=((tx%38)+38)%38,ry=((ty%38)+38)%38;
  if(rx<2||ry<2)return'road';
  // much fewer walls/rocks — raised thresholds
  if(n>0.92)return'wall';
  if(n>0.85)return'rock';
  if(n<0.12)return'water';
  if(n<0.22)return'grass';
  return'ground';
}

function terrainAt(tx,ty,zone){
  // Safe zone interior — all grass/ground
  if(tx>=SZ_X&&tx<SZ_X+SZ_W&&ty>=SZ_Y&&ty<SZ_Y+SZ_H){
    // outer ring = wall (fence)
    const onEdge=(tx===SZ_X||tx===SZ_X+SZ_W-1||ty===SZ_Y||ty===SZ_Y+SZ_H-1);
    if(onEdge){
      // gates (openings) on each side
      const mx=Math.floor(SZ_X+SZ_W/2),my=Math.floor(SZ_Y+SZ_H/2);
      if((tx===SZ_X||tx===SZ_X+SZ_W-1)&&Math.abs(ty-my)<=1)return'road'; // W/E gates
      if((ty===SZ_Y||ty===SZ_Y+SZ_H-1)&&Math.abs(tx-mx)<=1)return'road'; // N/S gates
      return'fence';
    }
    return'safe'; // inside safe zone
  }
  return baseTerrainAt(tx,ty,zone);
}

const CHUNKS=new Map();
function getChunk(cx,cy){const k=cx+','+cy;if(CHUNKS.has(k))return CHUNKS.get(k);const tiles=[];for(let y=0;y<16;y++){tiles[y]=[];for(let x=0;x<16;x++)tiles[y][x]=terrainAt(cx*16+x,cy*16+y,G?G.zone:0);}const ch={tiles};CHUNKS.set(k,ch);return ch;}
function getTile(tx,ty){if(tx<0||ty<0||tx>=WW||ty>=WH)return'wall';const ch=getChunk(Math.floor(tx/16),Math.floor(ty/16));return ch.tiles[ty%16][tx%16];}
function isBlocked(wx,wy){if(wx<1||wy<1||wx>=WW-1||wy>=WH-1)return true;const t=getTile(Math.floor(wx),Math.floor(wy));return t==='wall'||t==='water'||t==='fence';}
function inSafeZone(wx,wy){return wx>=SZ_X&&wx<SZ_X+SZ_W&&wy>=SZ_Y&&wy<SZ_Y+SZ_H;}

function calcStats(){
  const p=G.p;
  let hp=MECHS.find(m=>m.id===p.mech).bhp;
  let en=60,er=5,inv=8,dr=0;
  // armor slots: DR + cargo (no HP from armor anymore)
  for(const s of p.arSl){
    if(s){
      const mod=MODULES.find(x=>x.id===s);
      if(mod){dr+=mod.dr||0;inv+=mod.inv||0;}
    }
  }
  // energy slots
  for(const s of p.enSl){
    if(s){
      const mod=MODULES.find(x=>x.id===s);
      if(mod){en+=mod.ep||0;er+=mod.eg||0;}
    }
  }
  // skills
  hp=Math.round(hp*(1+p.sk.arm*.06));    // arm skill: +6% HP per level
  en=Math.round(en*(1+p.sk.ens*.1));
  er=Math.round(er*(1+p.sk.ens*.1)*10)/10;
  inv+=p.sk.crg*3;
  dr=Math.min(0.75, dr + p.sk.arm*0.01); // arm skill also adds 1% DR per level, cap 75%
  p.maxHp=hp;p.maxEn=en;p.enRegen=er;p.invMax=inv;
  p.dr=Math.round(dr*100)/100; // damage reduction 0..0.75
  p.hp=Math.min(p.hp,hp);p.en=Math.min(p.en,en);
  updFBtns();
}
function updFBtns(){
  const WICONS={ballistic:'🔫',energy:'⚡',rocket:'🚀'};
  for(let i=0;i<2;i++){
    const btn=document.getElementById('wb'+(i+1));
    const icn=document.getElementById('wi'+(i+1));
    const nm=document.getElementById('wn'+(i+1));
    const wid=G.p.w[i];
    if(wid){
      const w=WEAPONS.find(x=>x.id===wid);
      btn.classList.remove('wempty');
      icn.textContent=WICONS[w.t]||'🔫';
      nm.textContent=w.n;
      if(i===0){btn.className='wslot-btn ws1';}else{btn.className='wslot-btn ws2';}
    }else{
      btn.className='wslot-btn '+(i===0?'ws1':'ws2')+' wempty';
      icn.textContent='⚫';nm.textContent='ПУСТО';
    }
  }
}

// Level ranges per zone: city 1-30, wastes 30-70, ruins 70-110
// Distribution: near safe zone = low end, near boss corner (WW-50,WH-50) = high end
const ZONE_LV=[[1,30],[30,70],[70,110]];

function spawnMon(initial=false){
  const z=ZONES[G.zone];
  let wx,wy,tries=0;
  do{wx=5+Math.random()*(WW-10);wy=5+Math.random()*(WH-10);tries++;}
  while(tries<30&&(isBlocked(wx,wy)||inSafeZone(wx,wy)||(!initial&&Math.hypot(wx-G.p.wx,wy-G.p.wy)<30)));

  // monster level based on distance from safe zone center toward boss corner
  const safeCX=SZ_X+SZ_W/2,safeCY=SZ_Y+SZ_H/2;
  const bossCX=WW-50,bossCY=WH-50;
  const maxDist=Math.hypot(bossCX-safeCX,bossCY-safeCY);
  const dist=Math.hypot(wx-safeCX,wy-safeCY);
  const t01=Math.min(1,dist/maxDist);
  const [lvMin,lvMax]=ZONE_LV[G.zone];
  const monLv=Math.round(lvMin+(lvMax-lvMin)*t01);

  const mt=z.mon[Math.floor(Math.random()*z.mon.length)];
  const roll=Math.random();
  const tier=roll<0.05?2:roll<0.15?1:0;
  const tierMult=tier===2?10:tier===1?5:1;

  // HP and atk scale with monster level
  const hpBase=15+monLv*8;
  const atkBase=2+monLv*1.5;
  const xpBase=monLv*4;

  G.mons.push({wx,wy,
    hp:Math.round(hpBase*tierMult*(1+Math.random()*.3)),
    maxHp:Math.round(hpBase*tierMult),
    monLv, type:mt,
    spd:.035+monLv*.0008+G.zone*.005,
    xp:Math.round(xpBase*tierMult),
    loot:z.loot[Math.floor(Math.random()*z.loot.length)],
    lootMult:tierMult,tier,
    atk:Math.round(atkBase*tierMult),
    atkT:0,aggroed:false,aggroRange:10+tier*5,
    facing:Math.random()*Math.PI*2,walk:Math.random()*Math.PI*2,
    deathAnim:0,dead:false});
}

function placeBoss(){
  const z=ZONES[G.zone];const lm=1+G.zone*.9+G.p.lvl*.15;
  G.boss={wx:WW-50,wy:WH-50,hp:Math.round(500*50*lm),maxHp:Math.round(500*50*lm),
    name:z.bossName,col:z.acc,spd:.07+G.zone*.02,
    atk:Math.round((20+G.zone*10)*50),atkT:0,shootT:0,
    loot:z.bossLoot||[],xp:500+G.zone*200,cr:1000+G.zone*500,
    aggroed:false,facing:0,walk:0,dead:false};
}

function drawTile(tx,ty){
  const{x,y}=w2p(tx,ty);const s=PPT;
  if(x<-s*2||x>C.width+s*2||y<-s*2||y>C.height+s*2)return;
  const type=getTile(tx,ty);
  const z=ZONES[G.zone];
  const time=G.time*.001;

  if(type==='water'){
    const wave=Math.sin(time*1.5+tx*.4+ty*.3);
    const gw=ctx.createLinearGradient(x,y,x,y+s);
    gw.addColorStop(0,lc(z.water,8));gw.addColorStop(1,dc(z.water,5));
    ctx.fillStyle=gw;ctx.fillRect(x,y,s,s);
    // ripples
    ctx.strokeStyle='#ffffff14';ctx.lineWidth=1;
    for(let i=0;i<2;i++){ctx.beginPath();ctx.arc(x+s*.3+i*s*.4,y+s*.5+wave*2,s*.12,0,Math.PI*2);ctx.stroke();}
    ctx.fillStyle='#ffffff0c';ctx.fillRect(x+3,y+s*.4+wave*1.5,s-6,2);
    return;
  }

  if(type==='fence'){
    // FENCE — very visible
    ctx.fillStyle=z.fence||'#807040';ctx.fillRect(x,y,s,s);
    // 3D fence post effect
    const fg=ctx.createLinearGradient(x,y,x+s,y+s);
    fg.addColorStop(0,lc(z.fence||'#807040',30));
    fg.addColorStop(.5,z.fence||'#807040');
    fg.addColorStop(1,dc(z.fence||'#807040',30));
    ctx.fillStyle=fg;ctx.fillRect(x,y,s,s);
    // horizontal bars
    ctx.fillStyle='#ffffff22';ctx.fillRect(x,y+2,s,4);ctx.fillRect(x,y+s-6,s,4);
    ctx.fillStyle='#00000044';ctx.fillRect(x,y+s/2-2,s,4);
    // posts
    ctx.fillStyle='#00000044';ctx.fillRect(x,y,4,s);ctx.fillRect(x+s-4,y,4,s);
    // top highlight
    ctx.fillStyle='#ffffff33';ctx.fillRect(x,y,s,3);
    return;
  }

  if(type==='safe'){
    // Safe zone floor — bright green tiles
    const sg=ctx.createLinearGradient(x,y,x+s,y+s);
    sg.addColorStop(0,lc(z.safe||'#588038',18));
    sg.addColorStop(.5,z.safe||'#588038');
    sg.addColorStop(1,dc(z.safe||'#588038',12));
    ctx.fillStyle=sg;ctx.fillRect(x,y,s,s);
    // tile pattern
    ctx.strokeStyle='#00000018';ctx.lineWidth=.5;ctx.strokeRect(x,y,s,s);
    ctx.strokeStyle='#ffffff12';ctx.lineWidth=.5;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+s,y+s);ctx.stroke();
    // grass tufts
    ctx.fillStyle=lc(z.safe||'#588038',22)+'88';
    if((tx*5+ty*7)%9===0){ctx.fillRect(x+4,y+s-8,3,5);ctx.fillRect(x+10,y+s-9,2,4);}
    return;
  }

  // Base ground
  const baseCol={ground:z.ground,road:z.road,wall:z.wall,rock:z.rock,grass:z.grass}[type]||z.ground;

  if(type==='wall'){
    // WALLS — very 3D look
    const wg=ctx.createLinearGradient(x,y,x+s,y+s);
    wg.addColorStop(0,lc(baseCol,35));
    wg.addColorStop(.4,baseCol);
    wg.addColorStop(1,dc(baseCol,40));
    ctx.fillStyle=wg;ctx.fillRect(x,y,s,s);
    // brick lines
    ctx.strokeStyle='#00000033';ctx.lineWidth=1;
    for(let r=0;r<4;r++){
      ctx.beginPath();ctx.moveTo(x,y+r*s/4);ctx.lineTo(x+s,y+r*s/4);ctx.stroke();
      const off=(r%2)*(s/4);
      ctx.beginPath();ctx.moveTo(x+off,y+r*s/4);ctx.lineTo(x+off,y+(r+1)*s/4);ctx.stroke();
    }
    // strong highlight/shadow
    ctx.fillStyle='#ffffff28';ctx.fillRect(x,y,s,4);ctx.fillRect(x,y,4,s);
    ctx.fillStyle='#00000044';ctx.fillRect(x,y+s-4,s,4);ctx.fillRect(x+s-4,y,4,s);
    return;
  }

  const tg=ctx.createLinearGradient(x,y,x+s,y+s);
  tg.addColorStop(0,lc(baseCol,10));tg.addColorStop(.6,baseCol);tg.addColorStop(1,dc(baseCol,12));
  ctx.fillStyle=tg;ctx.fillRect(x,y,s,s);

  if(type==='ground'){
    // Pebbles & dirt detail
    if((tx*7+ty*11)%9===0){
      ctx.fillStyle='#00000020';ctx.beginPath();ctx.ellipse(x+s*.35,y+s*.65,3.5,2.5,.4,0,Math.PI*2);ctx.fill();
    }
    if((tx*13+ty*5)%11===0){
      ctx.fillStyle='#ffffff10';ctx.beginPath();ctx.ellipse(x+s*.7,y+s*.3,2,1.5,-.3,0,Math.PI*2);ctx.fill();
    }
    ctx.strokeStyle='#00000010';ctx.lineWidth=.3;ctx.strokeRect(x,y,s,s);
  }

  if(type==='grass'){
    // Rich grass with blades
    ctx.strokeStyle=lc(baseCol,28)+'cc';ctx.lineWidth=1.2;
    for(let g=0;g<5;g++){
      const gx=x+((tx*17+ty*13+g*37)%24)+3;
      const gy=y+((tx*11+ty*19+g*23)%(s-10))+4;
      ctx.beginPath();ctx.moveTo(gx,gy+5);ctx.quadraticCurveTo(gx+2,gy+1,gx+1,gy-5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(gx+5,gy+4);ctx.quadraticCurveTo(gx+7,gy,gx+6,gy-4);ctx.stroke();
    }
    ctx.strokeStyle='#00000015';ctx.lineWidth=.4;ctx.strokeRect(x,y,s,s);
  }

  if(type==='road'){
    // Road with lane markings
    ctx.fillStyle='#ffffff0c';ctx.fillRect(x,y,s,3);ctx.fillRect(x,y+s-3,s,3);
    if(((tx+ty)%3===0)){ctx.strokeStyle='#ffffff1a';ctx.lineWidth=2;ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(x+s*.5,y);ctx.lineTo(x+s*.5,y+s);ctx.stroke();ctx.setLineDash([]);}
    ctx.strokeStyle='#00000014';ctx.lineWidth=.3;ctx.strokeRect(x,y,s,s);
  }

  if(type==='rock'){
    // 3D rock
    ctx.fillStyle='#00000033';ctx.beginPath();ctx.ellipse(x+s*.55,y+s*.7,s*.33,s*.13,0,0,Math.PI*2);ctx.fill();
    const rg=ctx.createRadialGradient(x+s*.38,y+s*.33,1,x+s*.5,y+s*.46,s*.3);
    rg.addColorStop(0,lc(baseCol,35));rg.addColorStop(.5,baseCol);rg.addColorStop(1,dc(baseCol,20));
    ctx.fillStyle=rg;ctx.beginPath();ctx.ellipse(x+s*.5,y+s*.45,s*.28,s*.22,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffffff28';ctx.beginPath();ctx.ellipse(x+s*.36,y+s*.34,s*.1,s*.065,-.5,0,Math.PI*2);ctx.fill();
  }
}

function drawWorld(){
  ctx.fillStyle='#0a0a06';ctx.fillRect(0,0,C.width,C.height);
  const cx=Math.floor(camWx),cy=Math.floor(camWy),r=VIEW_R;
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const tx=cx+dx,ty=cy+dy;
    if(tx>=0&&ty>=0&&tx<WW&&ty<WH)drawTile(tx,ty);
  }
}

// ═══════════════════════════════════

// ═══════════════════════════════════
const MECH_C={
  scout:  {body:'#3d5030',leg:'#2d3a22',cpit:'#7ab8c8',acc:'#d4a030',glow:'#d4c040'},
  viper:  {body:'#2e3848',leg:'#202830',cpit:'#90b8e8',acc:'#50a0d8',glow:'#60c0f0'},
  assault:{body:'#4a3828',leg:'#3a2818',cpit:'#d0a060',acc:'#e07020',glow:'#f09040'},
  titan:  {body:'#2a2828',leg:'#1c1818',cpit:'#e07878',acc:'#c03838',glow:'#ff5050'},
  omegam: {body:'#181820',leg:'#101018',cpit:'#b890f0',acc:'#8050d0',glow:'#b080ff'}
};
function drawPlayerSprite(wx,wy,facing,walk,mechId){
  const{x,y}=w2p(wx,wy);
  const t=walk,bob=Math.abs(Math.sin(t*6))*2.5,leg=Math.sin(t*6)*5;
  const col=MECH_C[mechId]||MECH_C.scout;
  ctx.save();ctx.translate(x,y-18-bob);
  drawShadow(ctx,0,18+bob,16,6);

  // legs
  for(let li=0;li<2;li++){
    const loff=li===0?-1:1,yo=li===0?leg:-leg;
    const lx=li===0?-12:3;
    const lg=ctx.createLinearGradient(lx,4+yo,lx+9,18+yo);
    lg.addColorStop(0,lc(col.leg,15));lg.addColorStop(1,dc(col.leg,15));
    ctx.fillStyle=lg;ctx.fillRect(lx,4+yo,9,15);
    ctx.fillStyle=dc(col.leg,20);ctx.fillRect(lx-2,17+yo,13,5);
    // knee joint
    const kg=ctx.createRadialGradient(lx+4,13+yo,1,lx+4,13+yo,5);
    kg.addColorStop(0,lc(col.leg,25));kg.addColorStop(1,dc(col.leg,5));
    ctx.fillStyle=kg;ctx.beginPath();ctx.arc(lx+4,13+yo,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=col.acc+'99';ctx.beginPath();ctx.arc(lx+4,13+yo,2,0,Math.PI*2);ctx.fill();
  }

  // torso
  const tg=ctx.createLinearGradient(-13,-12,13,5);
  tg.addColorStop(0,lc(col.body,20));tg.addColorStop(.5,col.body);tg.addColorStop(1,dc(col.body,18));
  ctx.fillStyle=tg;ctx.beginPath();ctx.moveTo(-13,4);ctx.lineTo(13,4);ctx.lineTo(11,-12);ctx.lineTo(-11,-12);ctx.closePath();ctx.fill();
  // side panels
  ctx.fillStyle=dc(col.body,22);ctx.fillRect(-17,-1,6,13);ctx.fillRect(11,-1,6,13);
  ctx.fillStyle=lc(col.body,28);ctx.fillRect(-9,-10,5,8);ctx.fillRect(4,-10,5,8);
  // accent
  ctx.fillStyle=col.acc;ctx.fillRect(-10,0,20,2);
  ctx.shadowColor=col.glow;ctx.shadowBlur=4;ctx.fillRect(-10,0,20,2);ctx.shadowBlur=0;
  // vents
  ctx.fillStyle='#00000055';for(let v=0;v<3;v++)ctx.fillRect(-4+v*4,-9,2,6);

  // shoulders
  for(let si=0;si<2;si++){
    const sx=si===0?-16:16;
    const sg=ctx.createRadialGradient(sx,-7,1,sx,-7,10);
    sg.addColorStop(0,lc(col.body,28));sg.addColorStop(1,dc(col.body,8));
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,-7,9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=col.acc;ctx.shadowColor=col.glow;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(sx,-7,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#ffffff33';ctx.beginPath();ctx.arc(sx-1,-8.5,1.8,0,Math.PI*2);ctx.fill();
  }
  // weapon barrel
  if(G.p.w[0]){
    const bg=ctx.createLinearGradient(19,-11,35,-5);bg.addColorStop(0,'#4a4838');bg.addColorStop(1,'#282820');
    ctx.fillStyle=bg;ctx.fillRect(19,-11,17,7);
    ctx.fillStyle='#666658';ctx.fillRect(34,-10,7,5);
    ctx.fillStyle='#ffffff22';ctx.fillRect(19,-11,17,2);
  }

  // neck
  ctx.fillStyle=dc(col.body,28);ctx.fillRect(-4,-14,8,3);

  // head
  const hg=ctx.createLinearGradient(-9,-27,9,-13);
  hg.addColorStop(0,lc(col.body,22));hg.addColorStop(1,dc(col.body,12));
  ctx.fillStyle=hg;ctx.fillRect(-9,-27,18,14);
  ctx.fillStyle=lc(col.body,25);ctx.fillRect(-9,-27,18,3);ctx.fillRect(-9,-27,3,14);
  ctx.fillStyle=dc(col.body,22);ctx.fillRect(6,-27,3,14);ctx.fillRect(-9,-16,18,3);

  // visor
  const vg=ctx.createLinearGradient(-7,-24,7,-15);
  vg.addColorStop(0,lc(col.cpit,25));vg.addColorStop(1,dc(col.cpit,20));
  ctx.fillStyle=vg;ctx.shadowColor=col.glow;ctx.shadowBlur=12;
  ctx.fillRect(-7,-24,14,8);ctx.shadowBlur=0;
  ctx.fillStyle='#ffffff55';ctx.fillRect(-7,-24,6,3);
  ctx.fillStyle='#00000022';for(let sl=0;sl<4;sl++)ctx.fillRect(-7,-23+sl*2,14,1);

  // antenna
  ctx.fillStyle=col.acc;ctx.fillRect(-1,-31,2,5);
  ctx.shadowColor=col.glow;ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(0,-31,3.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.arc(-1,-32,1.2,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

function drawMonsterSprite(m){
  if(m.dead&&m.deathAnim>=1)return;
  const{x,y}=w2p(m.wx,m.wy);
  if(x<-110||x>C.width+110||y<-110||y>C.height+110)return;
  const t=m.walk,bob=Math.abs(Math.sin(t*6))*1.5;
  if(m.deathAnim>0)ctx.globalAlpha=Math.max(0,1-m.deathAnim*2);
  ctx.save();ctx.translate(x,y-13-bob);
  if(m.tier===1){ctx.shadowColor='#4488ff';ctx.shadowBlur=20;}
  else if(m.tier===2){ctx.shadowColor='#ff2020';ctx.shadowBlur=24;}
  const tp=m.type;

  if(tp.includes('Бот')||tp.includes('Часовой')||tp.includes('Бронепехота')||tp.includes('Мех')){
    const rc=tp.includes('Мех')?'#703090':tp.includes('Часовой')?'#405850':'#506038';
    drawShadow(ctx,0,15,11,4);
    const ls=Math.sin(t*6)*4;
    for(let li=0;li<2;li++){const lx=li===0?-9:2,yo=li===0?ls:-ls;
      const lg=ctx.createLinearGradient(lx,5+yo,lx+7,16+yo);lg.addColorStop(0,lc(rc,15));lg.addColorStop(1,dc(rc,15));
      ctx.fillStyle=lg;ctx.fillRect(lx,5+yo,7,11);ctx.fillStyle=dc(rc,20);ctx.fillRect(lx-2,13+yo,9,4);}
    const bg=ctx.createLinearGradient(-10,-4,10,9);bg.addColorStop(0,lc(rc,20));bg.addColorStop(1,dc(rc,10));
    ctx.fillStyle=bg;ctx.fillRect(-10,-4,20,12);
    ctx.fillStyle=lc(rc,25);ctx.fillRect(-8,-2,6,8);ctx.fillRect(2,-2,6,8);
    const ec=tp.includes('Мех')?'#dd00ff':'#ff3030';
    const eg=ctx.createRadialGradient(0,-1,0,0,-1,5);eg.addColorStop(0,'#ffffff');eg.addColorStop(.3,ec);eg.addColorStop(1,ec+'00');
    ctx.fillStyle=eg;ctx.shadowColor=ec;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(0,-1,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle=lc(rc,30);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-5,-4);ctx.lineTo(-7,-15);ctx.stroke();ctx.beginPath();ctx.moveTo(5,-4);ctx.lineTo(7,-15);ctx.stroke();
    ctx.fillStyle=ec+'cc';ctx.beginPath();ctx.arc(-7,-15,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(7,-15,2.5,0,Math.PI*2);ctx.fill();

  }else if(tp.includes('Скорп')||tp.includes('Краб')){
    const sc=tp.includes('Краб')?'#b06020':'#904a18';
    drawShadow(ctx,0,10,16,5);
    const sbg=ctx.createRadialGradient(0,-1,2,0,0,15);sbg.addColorStop(0,lc(sc,25));sbg.addColorStop(1,dc(sc,5));
    ctx.fillStyle=sbg;ctx.beginPath();ctx.ellipse(0,0,13,9,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=lc(sc,22);ctx.beginPath();ctx.ellipse(0,-2,9,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffffff22';ctx.beginPath();ctx.ellipse(-3,-4,4,2,-.3,0,Math.PI*2);ctx.fill();
    const ca=Math.sin(t*5)*.35;
    ctx.fillStyle=dc(sc,10);
    ctx.save();ctx.translate(-15,2);ctx.rotate(-ca-.2);ctx.fillRect(0,-3,14,5);ctx.restore();
    ctx.save();ctx.translate(15,2);ctx.rotate(ca+.2);ctx.fillRect(-14,-3,14,5);ctx.restore();
    if(tp.includes('Скорп')){
      const stg=ctx.createLinearGradient(0,8,14,-18);stg.addColorStop(0,sc);stg.addColorStop(1,dc(sc,20));
      ctx.strokeStyle=sc;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,8);ctx.quadraticCurveTo(18,2,14,-18);ctx.stroke();
      ctx.fillStyle='#ff5030';ctx.shadowColor='#ff5030';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(14,-18,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.arc(12,-19,2,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#ff1a1a';ctx.beginPath();ctx.arc(-4,-3,3.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(4,-3,3.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffffff66';ctx.beginPath();ctx.arc(-5,-4,1.3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(3,-4,1.3,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=dc(sc,18);ctx.lineWidth=2;
    for(let li=0;li<3;li++){const la=Math.sin(t*6+li)*.4;ctx.save();ctx.translate(-10+li*3,5);ctx.rotate(la);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-9,9);ctx.stroke();ctx.restore();ctx.save();ctx.translate(10-li*3,5);ctx.rotate(-la);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(9,9);ctx.stroke();ctx.restore();}

  }else if(tp.includes('Волк')||tp.includes('Пёс')){
    const wc='#7a5c3a';
    drawShadow(ctx,0,12,13,5);
    ctx.fillStyle=wc;ctx.beginPath();ctx.ellipse(0,3,9,6,0,0,Math.PI*2);ctx.fill();
    const hbg=ctx.createRadialGradient(-9,0,1,-9,0,9);hbg.addColorStop(0,lc(wc,18));hbg.addColorStop(1,wc);
    ctx.fillStyle=hbg;ctx.beginPath();ctx.arc(-9,0,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#c8a878';ctx.beginPath();ctx.ellipse(-17,2,5,4,-.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff3030';ctx.beginPath();ctx.moveTo(-20,4);ctx.lineTo(-14,4);ctx.lineTo(-16,8);ctx.closePath();ctx.fill();
    ctx.fillStyle=dc(wc,12);
    ctx.beginPath();ctx.moveTo(-11,-7);ctx.lineTo(-7,-18);ctx.lineTo(-3,-7);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(-17,-5);ctx.lineTo(-14,-14);ctx.lineTo(-10,-5);ctx.closePath();ctx.fill();
    const eg=ctx.createRadialGradient(-11,-1,0,-11,-1,4);eg.addColorStop(0,'#ffee00');eg.addColorStop(1,'#c08000');
    ctx.fillStyle=eg;ctx.beginPath();ctx.arc(-11,-1,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#200800';ctx.beginPath();ctx.arc(-10.5,-1,1.4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffffff66';ctx.beginPath();ctx.arc(-12.5,-2,1,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=lc(wc,8);ctx.lineWidth=4.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(9,0);ctx.quadraticCurveTo(18,-4,15,-14);ctx.stroke();
    const ll=Math.sin(t*7)*4;ctx.fillStyle=dc(wc,15);
    ctx.fillRect(-5,7,5,9+ll);ctx.fillRect(1,7,5,9-ll);ctx.fillRect(-6,14+ll,7,3);ctx.fillRect(0,14-ll,7,3);

  }else if(tp.includes('Страж')){
    const gc='#3a5030';
    drawShadow(ctx,0,17,16,6);
    const lv=Math.sin(t*5)*5;
    for(let li=0;li<2;li++){const lx=li===0?-11:2,yo=li===0?lv:-lv;ctx.fillStyle=dc(gc,20);ctx.fillRect(lx,8+yo,9,17);ctx.fillRect(lx-2,21+yo,11,5);}
    const tg=ctx.createLinearGradient(-13,-4,13,12);tg.addColorStop(0,lc(gc,22));tg.addColorStop(1,dc(gc,12));
    ctx.fillStyle=tg;ctx.fillRect(-13,-4,26,14);
    const acc=ZONES[G.zone].acc;
    for(let si=0;si<2;si++){const sx=si===0?-15:15;ctx.fillStyle=dc(gc,8);ctx.beginPath();ctx.arc(sx,-1,9,0,Math.PI*2);ctx.fill();ctx.fillStyle=acc;ctx.shadowColor=acc;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(sx,-1,4.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffff44';ctx.beginPath();ctx.arc(sx-1,-2,1.8,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle=tg;ctx.fillRect(-9,-21,18,18);
    ctx.fillStyle=lc(gc,22);ctx.fillRect(-9,-21,18,3);ctx.fillRect(-9,-21,3,18);
    ctx.fillStyle='#00c888';ctx.shadowColor='#00c888';ctx.shadowBlur=12;ctx.fillRect(-6,-18,12,8);ctx.shadowBlur=0;
    ctx.fillStyle='#ffffff55';ctx.fillRect(-5,-17,5,3);

  }else{
    const gc=tp.includes('Призрак')||tp.includes('Теневик')?'#304050':'#5a4028';
    if(tp.includes('Призрак'))ctx.globalAlpha*=.72;
    drawShadow(ctx,0,12,9,3);
    const bg=ctx.createLinearGradient(-8,-2,8,10);bg.addColorStop(0,lc(gc,18));bg.addColorStop(1,gc);

// ═══════════════════════════════════
// AUTO TARGET
// ═══════════════════════════════════
function autoTarget(){
  const all=[...G.mons.filter(m=>!m.dead&&m.hp>0)];
  if(G.boss&&!G.boss.dead)all.push(G.boss);
  for(let wi=0;wi<2;wi++){
    if(!G.p.w[wi]){G.targets[wi]=null;continue;}
    const w=WEAPONS.find(x=>x.id===G.p.w[wi]);const wr=w.rng/PPT+2;
    let best=null,bestD=wr;
    for(const e of all){const d=Math.hypot(e.wx-G.p.wx,e.wy-G.p.wy);if(d<bestD){bestD=d;best=e;}}
    G.targets[wi]=best;
  }
}

// ═══════════════════════════════════
// FIRE
// ═══════════════════════════════════
function ft(wi,e){
  if(e)e.preventDefault();if(!G.started)return;
  const p=G.p;if(!p.w[wi])return notify('SLOT '+(wi+1)+' пуст!');if(G.ftimers[wi]>0)return;
  const w=WEAPONS.find(x=>x.id===p.w[wi]);if(!w)return;
  if(p.en<w.ec)return notify('НЕТ ЭНЕРГИИ');
  const tg=G.targets[wi];let dx,dy;
  if(tg){dx=tg.wx-p.wx;dy=tg.wy-p.wy;}else{dx=G.jd.x||1;dy=G.jd.y||0;}
  const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;
  p.en=Math.max(0,p.en-w.ec);
  G.ftimers[wi]=1/w.rof;
  const sk=w.t==='ballistic'?p.sk.bal:w.t==='energy'?p.sk.enw:p.sk.rkt;
  const dmg=Math.round(w.dmg*(1+sk*.12)),rng=w.rng/PPT+sk*.3;
  G.projs.push({wx:p.wx,wy:p.wy,vx:dx*.32,vy:dy*.32,type:w.t,dmg,range:rng,traveled:0,fromBoss:false});
  psh(w.t);
  const btn=document.getElementById('wb'+(wi+1));btn.classList.add('lit');setTimeout(()=>btn.classList.remove('lit'),100);
}

// ═══════════════════════════════════
// UPDATE
// ═══════════════════════════════════
function update(dt){
  const p=G.p;G.time+=dt*1000;
  // movement
  if(G.jd.x||G.jd.y){
    const l=Math.hypot(G.jd.x,G.jd.y)||1,spd=.1;
    const nx=p.wx+G.jd.x/l*spd,ny=p.wy+G.jd.y/l*spd;
    if(!isBlocked(nx,p.wy))p.wx=Math.max(1,Math.min(WW-1,nx));
    if(!isBlocked(p.wx,ny))p.wy=Math.max(1,Math.min(WH-1,ny));
    p.facing=Math.atan2(G.jd.y,G.jd.x);p.walk+=dt*3.5;
  }
  p.en=Math.min(p.maxEn,p.en+p.enRegen*dt);
  for(let i=0;i<2;i++)if(G.ftimers[i]>0)G.ftimers[i]-=dt;
  autoTarget();
  // auto-battle: fire both slots automatically
  if(G.autoBattle){for(let wi=0;wi<2;wi++){if(G.targets[wi]&&G.ftimers[wi]<=0)ft(wi,null);}}

  // respawn ~3min
  G.spawnTimer-=dt;
  if(G.spawnTimer<=0){const alive=G.mons.filter(m=>!m.dead&&m.hp>0).length;if(alive<250+G.zone*80)spawnMon();G.spawnTimer=170+Math.random()*20;}

  // portal
  if(!G.zone_entered)for(const port of G.portals){if(Math.hypot(p.wx-port.wx,p.wy-port.wy)<2.5){enterZone(port.toZone);break;}}

  // TURRETS — shoot monsters near gates
  for(const tr of G.turrets){
    tr.shootT-=dt;if(tr.shootT>0)continue;
    let closestMon=null,closestD=tr.range;
    for(const m of G.mons){
      if(m.dead||m.hp<=0)continue;
      const d=Math.hypot(m.wx-tr.wx,m.wy-tr.wy);
      if(d<closestD){closestD=d;closestMon=m;}
    }
    if(closestMon){
      tr.shootT=1.2;
      closestMon.hp-=tr.dmg;
      spawnParts(closestMon.wx,closestMon.wy,'#80ff40',4,true);
      if(closestMon.hp<=0)killMon(closestMon);
    }
  }

  // projectiles
  for(const pr of G.projs){
    pr.wx+=pr.vx;pr.wy+=pr.vy;pr.traveled+=Math.hypot(pr.vx,pr.vy);
    if(pr.traveled>pr.range){pr.dead=true;continue;}
    if(!pr.fromBoss){
      for(const m of G.mons){if(m.dead||m.hp<=0)continue;if(Math.hypot(pr.wx-m.wx,pr.wy-m.wy)<.9){m.hp-=pr.dmg;pr.dead=true;m.aggroed=true;spawnParts(m.wx,m.wy,'#e07020',5,true);if(m.hp<=0)killMon(m);break;}}
      if(!pr.dead&&G.boss&&!G.boss.dead&&Math.hypot(pr.wx-G.boss.wx,pr.wy-G.boss.wy)<2.2){G.boss.hp-=pr.dmg;pr.dead=true;G.boss.aggroed=true;document.getElementById('bbar').style.display='flex';spawnParts(G.boss.wx,G.boss.wy,'#ff4040',8,true);if(G.boss.hp<=0)killBoss();}
    }else{if(Math.hypot(pr.wx-p.wx,pr.wy-p.wy)<.9){p.hp=Math.max(0,p.hp-pr.dmg);pr.dead=true;spawnParts(p.wx,p.wy,'#ff4040',5,true);if(p.hp<=0)respawn();}}
  }
  G.projs=G.projs.filter(x=>!x.dead);

  // monsters — prevent entering safe zone
  for(const m of G.mons){
    if(m.dead)continue;
    if(m.hp<=0&&!m.dead){m.deathAnim=(m.deathAnim||0)+dt*3;if(m.deathAnim>=1)m.dead=true;continue;}
    const d=Math.hypot(m.wx-p.wx,m.wy-p.wy);
    if(d>AI_LITE){m.walk+=dt*.2;continue;}
    if(d>AI_FULL){m.walk+=dt*.7;if(m.aggroed&&!inSafeZone(m.wx,m.wy)){m.wx+=(p.wx-m.wx)/d*m.spd*.4;m.wy+=(p.wy-m.wy)/d*m.spd*.4;}continue;}
    m.walk+=dt*2;
    if(d<m.aggroRange)m.aggroed=true;if(d>m.aggroRange*5)m.aggroed=false;
    if(m.aggroed&&d>.8&&!inSafeZone(m.wx,m.wy)){
      const nx=m.wx+(p.wx-m.wx)/d*m.spd,ny=m.wy+(p.wy-m.wy)/d*m.spd;
      // block monsters from entering safe zone
      if(!isBlocked(nx,m.wy)&&!inSafeZone(nx,m.wy))m.wx=nx;
      if(!isBlocked(m.wx,ny)&&!inSafeZone(m.wx,ny))m.wy=ny;
      m.facing=Math.atan2(p.wy-m.wy,p.wx-m.wx);
    }else if(!m.aggroed){m.wx+=Math.sin(m.walk*.4+m.wx)*.006;m.wy+=Math.cos(m.walk*.4+m.wy)*.006;m.wx=Math.max(1,Math.min(WW-1,m.wx));m.wy=Math.max(1,Math.min(WH-1,m.wy));}
    if(m.aggroed&&d<1.2&&!inSafeZone(p.wx,p.wy)){m.atkT-=dt;if(m.atkT<=0){p.hp=Math.max(0,p.hp-m.atk);m.atkT=1.5;spawnParts(p.wx,p.wy,'#ff4040',3,true);if(p.hp<=0)respawn();}}
  }

  // boss
  if(G.boss&&!G.boss.dead){
    const b=G.boss,d=Math.hypot(b.wx-p.wx,b.wy-p.wy);
    if(b.aggroed){
      b.walk+=dt*1.2;const bs=b.spd*(b.hp<b.maxHp*.4?1.6:1);
      if(d>2){const nx=b.wx+(p.wx-b.wx)/d*bs,ny=b.wy+(p.wy-b.wy)/d*bs;if(!isBlocked(nx,b.wy))b.wx=nx;if(!isBlocked(b.wx,ny))b.wy=ny;}
      if(d<2.5){b.atkT-=dt;if(b.atkT<=0){p.hp=Math.max(0,p.hp-b.atk);b.atkT=1.2;spawnParts(p.wx,p.wy,'#ff4040',7,true);if(p.hp<=0)respawn();}}
      b.shootT-=dt;if(b.shootT<=0){b.shootT=b.hp<b.maxHp*.5?1.2:2.2;const shots=b.hp<b.maxHp*.3?3:b.hp<b.maxHp*.5?2:1;for(let s=0;s<shots;s++){const ang=Math.atan2(p.wy-b.wy,p.wx-b.wx)+(s-(shots-1)/2)*.4;G.projs.push({wx:b.wx,wy:b.wy,vx:Math.cos(ang)*.22,vy:Math.sin(ang)*.22,type:'boss',dmg:Math.round(b.atk*.04),range:20,traveled:0,fromBoss:true});}}
    }
  }

  for(const pt of G.parts){pt.wx+=pt.vx;pt.wy+=pt.vy;pt.life--;}G.parts=G.parts.filter(x=>x.life>0);
  G.saveTimer-=dt;if(G.saveTimer<=0){saveGame();G.saveTimer=30;}
  updHUD();
}

function killMon(m){
  spawnParts(m.wx,m.wy,m.tier===2?'#ff4040':m.tier===1?'#4488ff':'#e07020',14,true);
  G.p.xp+=m.xp;G.p.cr+=Math.round((5+G.zone*3)*m.lootMult);
  if(G.p.inv.length<G.p.invMax){const nm=m.tier>0?m.loot+'★'.repeat(m.tier):m.loot;G.p.inv.push({type:'loot',name:nm,id:'l'+G.time+Math.random(),price:Math.round((LOOT_P[m.loot]||20)*m.lootMult)});}
  if(G.p.xp>=G.p.xpNext)levelUp();updHUD();
}
function killBoss(){
  const b=G.boss;for(let i=0;i<8;i++)spawnParts(b.wx+(Math.random()-.5)*5,b.wy+(Math.random()-.5)*5,'#ff4040',18,true);
  G.p.xp+=b.xp;G.p.cr+=b.cr;
  for(const l of b.loot)if(G.p.inv.length<G.p.invMax)G.p.inv.push({type:'loot',name:l,id:'l'+G.time+Math.random(),price:600+G.zone*200});
  if(Math.random()<.1){const uids=['godshot','voidb','omegar'];const uid=uids[G.zone%3];const uw=WEAPONS.find(x=>x.id===uid);if(uw&&G.p.inv.length<G.p.invMax){G.p.inv.push({type:'weapon',id:uid,name:'⭐ '+uw.n,unique:true});notify('🌟 УНИКАЛЬНОЕ: '+uw.n+'!');}}
  b.dead=true;document.getElementById('bbar').style.display='none';notify('🏆 БОСС: +'+b.cr+' CR');if(G.p.xp>=G.p.xpNext)levelUp();updHUD();
}
function respawn(){notify('МЕХ УНИЧТОЖЕН...');G.p.hp=Math.round(G.p.maxHp*.4);G.p.wx=SPAWN_X;G.p.wy=SPAWN_Y;}
function levelUp(){G.p.xp-=G.p.xpNext;G.p.lvl++;G.p.xpNext=Math.round(G.p.xpNext*1.45);G.p.skillPts++;document.getElementById('overlay-lvl').style.display='flex';renderSkills();}
function enterZone(to){if(G.zone_entered)return;G.zone_entered=true;notify('Переход: '+ZONES[to].name+'...');setTimeout(()=>{G.zone=to;G.p.wx=SPAWN_X;G.p.wy=SPAWN_Y;CHUNKS.clear();genWorld();calcStats();notify('Зона: '+ZONES[G.zone].name);},900);}
function renderSkills(){
  const p=G.p;const sks=[{k:'bal',l:'BALLISTIC',d:'+12% пушки'},{k:'enw',l:'ENERGY',d:'+12% лазеры'},{k:'rkt',l:'ROCKETS',d:'+12% ракеты'},{k:'arm',l:'ARMOR',d:'+8% HP'},{k:'crg',l:'CARGO',d:'+2 ячейки'},{k:'ens',l:'ENERGY SYS',d:'+10% EN'}];
  const el=document.getElementById('skc');el.innerHTML='';
  for(const sk of sks){const b=document.createElement('button');b.className='sk-btn';b.innerHTML=`<b style="color:#d4c040">${sk.l}</b> <span style="color:#a09040">LV${p.sk[sk.k]}</span><br><span style="opacity:.7">${sk.d}</span>`;b.onclick=()=>{p.sk[sk.k]++;p.skillPts--;calcStats();if(p.skillPts>0)renderSkills();else document.getElementById('overlay-lvl').style.display='none';notify('Прокачано: '+sk.l);};el.appendChild(b);}
  document.getElementById('skpts').textContent='Очков: '+p.skillPts;
}
function updHUD(){
  const p=G.p;
  const el=id=>document.getElementById(id);
  if(el('h-lvl'))el('h-lvl').textContent=p.lvl;
  if(el('h-xp'))el('h-xp').textContent=p.xp+'/'+p.xpNext;
  if(el('h-cr'))el('h-cr').textContent=p.cr;
  if(el('h-hp'))el('h-hp').textContent=Math.ceil(p.hp)+'/'+p.maxHp;
  if(el('h-en'))el('h-en').textContent=Math.ceil(p.en)+'/'+p.maxEn;
  if(el('bhp'))el('bhp').style.width=(p.hp/p.maxHp*100)+'%';
  if(el('ben'))el('ben').style.width=(p.en/p.maxEn*100)+'%';
}

function startGame(){
  const sv=loadGame();
  if(sv&&sv.p){Object.assign(G.p,sv.p);G.p.enSl=G.p.enSl||[null,null,null,null];G.p.arSl=G.p.arSl||[null,null];G.p.inv=G.p.inv||[];G.p.sk=G.p.sk||{bal:0,enw:0,rkt:0,arm:0,crg:0,ens:0};G.zone=sv.zone||0;}
  G.p.w[0]=G.p.w[0]||'pistol';G.started=true;G.saveTimer=30;
  document.getElementById('overlay-start').style.display='none';
  CHUNKS.clear();genWorld();calcStats();requestAnimationFrame(loop);
}
function loop(ts){
  if(!G.started){requestAnimationFrame(loop);return;}
  const dt=Math.min((ts-G.lastT)/1000,.05);G.lastT=ts;
  C.width=C.parentElement.clientWidth;C.height=C.parentElement.clientHeight;
  updCam();update(dt);drawWorld();
  for(const pt of G.portals)drawPortal(pt);const ents=[
  ...G.mons.filter(m=>!m.dead||(m.deathAnim&&m.deathAnim<1)).map(m=>({t:'m',o:m,s:m.wx+m.wy})),...G.npcs.map(n=>({t:'n',o:n,s:n.wx+n.wy})),{t:'p',o:G.p,s:G.p.wx+G.p.wy},...(G.boss&&!G.boss.dead?[{t:'b',o:G.boss,s:G.boss.wx+G.boss.wy}]:[])].sort((a,b)=>a.s-b.s);
  for(const e of ents){if(e.t==='m')drawMonsterSprite(e.o);else if(e.t==='n')drawNPCSprite(e.o);else if(e.t==='p')drawPlayerSprite(G.p.wx,G.p.wy,G.p.facing,G.p.walk,G.p.mech);else if(e.t==='b')drawBossSprite();}
  for(const tr of G.turrets)drawTurretSprite(tr);
  for(const pr of G.projs)drawProjectile(pr);
  for(const pt of G.parts)drawParticle(pt);
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  drawHUDCanvas();drawMinimap();
  requestAnimationFrame(loop);
}

let curTab='inv';
function op(tab){document.getElementById('panel').style.display='flex';sw(tab||curTab);}
function sw(tab){curTab=tab;['inv','mech','shop'].forEach(t=>document.getElementById('t-'+t).classList.toggle('on',t===tab));if(tab==='inv')rInv();else if(tab==='mech')rMech();else rShop();}
function cp(){document.getElementById('panel').style.display='none';}

function rInv(){
  const p=G.p,b=document.getElementById('pbody');let h='';
  const loot=p.inv.filter(x=>x.type==='loot');
  h+=`<div class="psec">📦 Лут (${loot.length} шт.)</div>`;
  if(!loot.length)h+=`<div style="font-size:10px;color:#8a7840;padding:10px;text-align:center">Нет лута — убивай монстров!</div>`;
  else{
    const cnt={};for(const it of loot)cnt[it.name]=(cnt[it.name]||[]).concat(it);
    for(const[nm,its]of Object.entries(cnt)){const pr=its[0].price||LOOT_P[nm]||20;h+=`<div class="invrow"><div style="flex:1"><div class="irvname">${nm} ×${its.length}</div><div class="irvstat">${pr} CR за шт.</div></div><button class="irvbtn sbtn" onclick="sLN('${nm}')">ПРОДАТЬ</button></div>`;}
    h+=`<button style="width:100%;margin-top:6px;padding:10px;border:none;background:linear-gradient(135deg,#c09030,#806010);color:#fff;font-weight:bold;border-radius:10px;cursor:pointer;font-size:10px;box-shadow:0 4px 12px #c0903055" onclick="sAll()">💰 ПРОДАТЬ ВЕСЬ ЛУТ</button>`;
  }
  const gear=p.inv.filter(x=>x.type!=='loot');
  h+=`<div class="psec">⚙ Снаряжение (${gear.length})</div>`;
  if(!gear.length)h+=`<div style="font-size:10px;color:#8a7840;padding:10px;text-align:center">Пусто — сними с меха в разделе МЕХ</div>`;
  for(const item of gear){let stat='',canEq=false,sp=0;if(item.type==='weapon'){const w=WEAPONS.find(x=>x.id===item.id);if(w){stat=w.t+' D:'+w.dmg;canEq=p.lvl>=w.lv;sp=w.sell;}}else if(item.type==='module'){const m=MODULES.find(x=>x.id===item.id);if(m){stat=m.d;canEq=p.lvl>=m.lv;sp=m.sell;}}else if(item.type==='mech'){const mc=MECHS.find(x=>x.id===item.id);if(mc){stat='HP:'+mc.bhp;canEq=p.lvl>=mc.lv;sp=mc.sell;}}
    h+=`<div class="invrow"><div style="flex:1"><div class="irvname">${item.name||item.id}</div><div class="irvstat">${stat}</div></div>${canEq?`<button class="irvbtn ebtn" onclick="eqInv('${item.id}','${item.type}')">ОДЕТЬ</button>`:''}<button class="irvbtn sbtn" onclick="sGear('${item.id}','${item.type}')">ПРОД. ${sp}</button></div>`;}
  b.innerHTML=h;
}
function sLN(nm){const idx=G.p.inv.findIndex(x=>x.type==='loot'&&x.name===nm);if(idx===-1)return;const pr=G.p.inv[idx].price||LOOT_P[nm]||20;G.p.inv.splice(idx,1);G.p.cr+=pr;notify('+'+pr+' CR');updHUD();rInv();}
function sAll(){let t=0;G.p.inv=G.p.inv.filter(x=>{if(x.type==='loot'){t+=x.price||LOOT_P[x.name]||20;return false;}return true;});G.p.cr+=t;notify('Продано! +'+t+' CR');updHUD();rInv();}
function sGear(id,type){const arr=type==='weapon'?WEAPONS:type==='module'?MODULES:MECHS;const def=arr.find(x=>x.id===id);const pr=def?def.sell:10;const idx=G.p.inv.findIndex(x=>x.id===id&&x.type===type);if(idx===-1)return;G.p.inv.splice(idx,1);G.p.cr+=pr;notify('+'+pr+' CR');updHUD();rInv();}
function eqInv(id,type){if(type==='weapon'){const sl=G.p.w.indexOf(null);if(sl===-1)return notify('Слоты заняты!');const idx=G.p.inv.findIndex(x=>x.id===id&&x.type==='weapon');if(idx===-1)return;G.p.inv.splice(idx,1);G.p.w[sl]=id;calcStats();notify('✓ Экипировано!');rInv();}else if(type==='module'){const m=MODULES.find(x=>x.id===id);const arr=m.sl==='en'?G.p.enSl:G.p.arSl;const sl=arr.indexOf(null);if(sl===-1)return notify('Слоты заняты!');const idx=G.p.inv.findIndex(x=>x.id===id&&x.type==='module');if(idx===-1)return;G.p.inv.splice(idx,1);arr[sl]=id;calcStats();notify('✓ Установлено!');rInv();}else if(type==='mech'){const idx=G.p.inv.findIndex(x=>x.id===id&&x.type==='mech');if(idx===-1)return;G.p.inv.splice(idx,1);G.p.mech=id;calcStats();notify('✓ Мех активирован!');rInv();}}

function rMech(){
  const p=G.p,b=document.getElementById('pbody');
  let h=`<div class="psec">🔫 Оружие (2 слота)</div><div style="display:flex;gap:6px;margin-bottom:8px">`;
  for(let i=0;i<2;i++){const w=p.w[i]?WEAPONS.find(x=>x.id===p.w[i]):null;h+=`<div class="mslot sw" onclick="rmW(${i})">${w?`<span style="font-size:7px;font-weight:bold">${w.n}</span><br><span style="font-size:6px;color:#903010">${w.t.toUpperCase()}</span><br><span style="font-size:6px;color:#c06040">[нажми — снять]</span>`:`<span style="font-size:20px">＋</span><br><span style="font-size:7px">оружие</span>`}</div>`;}
  h+=`</div><div class="psec">⚡ Энергия (4 слота)</div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">`;
  for(let i=0;i<4;i++){const m=p.enSl[i]?MODULES.find(x=>x.id===p.enSl[i]):null;h+=`<div class="mslot se" onclick="rmM('en',${i})">${m?`<span style="font-size:7px;font-weight:bold">${m.n}</span><br><span style="font-size:6px;color:#103080">${m.d}</span><br><span style="font-size:6px;color:#2060a0">[снять]</span>`:`<span style="font-size:20px">＋</span><br><span style="font-size:7px">ген/батарея</span>`}</div>`;}
  h+=`</div><div class="psec">🛡 Броня / Трюм (2 слота)</div><div style="display:flex;gap:6px;margin-bottom:10px">`;
  for(let i=0;i<2;i++){const m=p.arSl[i]?MODULES.find(x=>x.id===p.arSl[i]):null;h+=`<div class="mslot sa" onclick="rmM('ar',${i})">${m?`<span style="font-size:7px;font-weight:bold">${m.n}</span><br><span style="font-size:6px;color:#604010">${m.d}</span><br><span style="font-size:6px;color:#906030">[снять]</span>`:`<span style="font-size:20px">＋</span><br><span style="font-size:7px">броня/трюм</span>`}</div>`;}
  const mc=MECHS.find(m=>m.id===p.mech);
  h+=`</div><div class="psec">📊 Характеристики</div>`;
  h+=`<div style="background:linear-gradient(135deg,#ffffff,#f4f0e0);border:1px solid #d4c890;border-radius:12px;padding:12px;box-shadow:0 4px 12px #00000015">`;
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:10px">`;
  h+=`<div style="padding:6px;background:#f0f8e0;border-radius:8px;border:1px solid #a0c060"><div style="color:#6a7840;font-size:8px">МЕХ</div><div style="font-weight:bold;color:#304010">${mc.n}</div></div>`;
  h+=`<div style="padding:6px;background:#e8f0ff;border-radius:8px;border:1px solid #6090c0"><div style="color:#406080;font-size:8px">EN REGEN</div><div style="font-weight:bold;color:#203060">${p.enRegen}/с</div></div>`;
  h+=`<div style="padding:6px;background:#ffe8e8;border-radius:8px;border:1px solid #c07060"><div style="color:#804030;font-size:8px">HP</div><div style="font-weight:bold;color:#602010">${Math.ceil(p.hp)} / ${p.maxHp}</div></div>`;
  h+=`<div style="padding:6px;background:#e8f4ff;border-radius:8px;border:1px solid #5088b0"><div style="color:#305878;font-size:8px">ENERGY</div><div style="font-weight:bold;color:#103858">${Math.ceil(p.en)} / ${p.maxEn}</div></div>`;
  h+=`<div style="padding:6px;background:#fff8e0;border-radius:8px;border:1px solid #c0a040"><div style="color:#806020;font-size:8px">ТРЮМ</div><div style="font-weight:bold;color:#504010">${p.inv.length} / ${p.invMax}</div></div>`;
  h+=`<div style="padding:6px;background:#f8f0ff;border-radius:8px;border:1px solid #a080c0"><div style="color:#604080;font-size:8px">УРОВЕНЬ</div><div style="font-weight:bold;color:#402060">LVL ${p.lvl}</div></div>`;
  h+=`</div>`;
  h+=`<div style="margin-top:8px;font-size:8px;color:#806040;font-family:'Courier New',monospace">NAV:${p.sk.bal} ENW:${p.sk.enw} RKT:${p.sk.rkt} ARM:${p.sk.arm} CRG:${p.sk.crg} ENS:${p.sk.ens}</div>`;
  h+=`</div>`;
  if(p.skillPts>0)h+=`<button style="width:100%;margin-top:8px;padding:12px;border:none;background:linear-gradient(135deg,#c09030,#806010);color:#fff;font-weight:bold;border-radius:12px;cursor:pointer;font-size:11px;box-shadow:0 4px 16px #c0903066" onclick="document.getElementById('panel').style.display='none';document.getElementById('overlay-lvl').style.display='flex';renderSkills()">⚡ РАСПРЕДЕЛИТЬ ${p.skillPts} ОЧКОВ</button>`;
  b.innerHTML=h;
}
function rmW(i){const id=G.p.w[i];if(!id)return;const w=WEAPONS.find(x=>x.id===id);if(G.p.inv.length<G.p.invMax){G.p.inv.push({type:'weapon',id,name:w.n});G.p.w[i]=null;calcStats();notify('→ инвентарь');}else notify('Инвентарь полон!');rMech();}
function rmM(t,i){const arr=t==='en'?G.p.enSl:G.p.arSl;const id=arr[i];if(!id)return;const m=MODULES.find(x=>x.id===id);if(G.p.inv.length<G.p.invMax){G.p.inv.push({type:'module',id,name:m.n});arr[i]=null;calcStats();notify('→ инвентарь');}else notify('Инвентарь полон!');rMech();}

function rShop(){
  const p=G.p,b=document.getElementById('pbody');
  const nearTrader=G.npcs.some(n=>n.type==='trader'&&Math.hypot(G.p.wx-n.wx,G.p.wy-n.wy)<16);
  const nearMechanic=G.npcs.some(n=>n.type==='mechanic'&&Math.hypot(G.p.wx-n.wx,G.p.wy-n.wy)<16);
  const near=nearTrader||nearMechanic;
  if(!near){b.innerHTML=`<div style="text-align:center;padding:40px 20px"><div style="font-size:50px;margin-bottom:12px">🏪</div><div style="font-size:14px;color:#604010;font-weight:bold;margin-bottom:8px">Никого рядом</div><div style="font-size:10px;color:#8a7840">Войди в Безопасную Зону.<br>🟢 Торговец — покупка/продажа<br>🔵 Механик — ремонт меха</div></div>`;return;}
  let h='';
  // MECHANIC section
  if(nearMechanic){
    const cost=repairCost();const full=p.hp>=p.maxHp;
    h+=`<div style="background:linear-gradient(135deg,#e0f0ff,#c8e4f8);border:2px solid #2080c0;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 4px 12px #2080c033">
      <div style="font-size:14px;font-weight:bold;color:#103060;margin-bottom:4px">🔧 МЕХАНИК</div>
      <div style="font-size:10px;color:#204870;margin-bottom:8px">HP: ${Math.ceil(p.hp)} / ${p.maxHp} ${full?'<span style="color:#20a040">✓ Полный</span>':''}</div>
      ${full?'<div style="font-size:10px;color:#408040">Мех в порядке!</div>':`<button onclick="tryRepair()" style="width:100%;padding:10px;border:none;background:linear-gradient(135deg,#2080c0,#103060);color:#fff;font-weight:bold;border-radius:8px;cursor:pointer;font-size:11px;box-shadow:0 3px 10px #2080c055">🔧 ПОЧИНИТЬ — ${cost} CR</button>`}
    </div>`;
  }
  if(!nearTrader){b.innerHTML=h;return;}
  h+=`<div style="background:linear-gradient(135deg,#fff8e0,#f4e8a0);border:1px solid #c8a830;border-radius:12px;padding:10px 14px;margin-bottom:10px;box-shadow:0 2px 8px #c8a83033"><div style="font-size:12px;color:#604010;font-weight:bold">💰 Кредиты: ${p.cr} CR</div><div style="font-size:9px;color:#8a7040">LVL ${p.lvl} · Нажми чтобы купить</div></div>`;
  const mkC=(item,type,can,own,lk,buyFn)=>{return`<div class="icard ${own?'owned':''} ${lk?'locked':''}" onclick="${can?buyFn:'void 0'}"><span class="ilvl ${lk?'no':'ok'}">LV${item.lv}</span><div class="iname">${item.n||item.name}${own?' ✓':''}</div><div class="istat">${type==='w'?item.t.toUpperCase()+' ·D:'+item.dmg+' ·R:'+item.rng+' ·ROF:'+item.rof+' ·EN:'+item.ec+' — '+item.d:item.d}</div><div class="iprice">${item.p===0?'<span style="color:#40a020">БЕСПЛАТНО</span>':item.p+' CR'} ${lk?`<span style="color:#c03020">🔒 LV${item.lv}</span>`:can?`<span style="color:#408020">→ КУПИТЬ</span>`:own?`<span style="color:#808040">✓ Есть</span>`:`<span style="color:#907030">Мало CR</span>`}</div></div>`;};
  h+=`<div class="psec">🔫 Оружие</div>`;
  for(const w of WEAPONS.filter(x=>!x.unique)){
  const own=false;
  const lk=p.lvl<w.lv;
  const can=!lk&&p.cr>=w.p;
  h+=mkC(w,'w',can,own,lk,`sW('${w.id}')`);
  }
  h+=`<div class="psec">⚡ Энергомодули</div>`;
  for(const m of MODULES.filter(x=>x.sl==='en')){
  const ins=false;
  const lk=p.lvl<m.lv;
  const can=!lk&&p.cr>=m.p;
  h+=mkC(m,'m',can,ins,lk,`sM('${m.id}')`);
  }
  h+=`<div class="psec">🛡 Броня / Трюм</div>`;
  for(const m of MODULES.filter(x=>x.sl==='ar')){
  const ins=false;
  const lk=p.lvl<m.lv;
  const can=!lk&&p.cr>=m.p;
  h+=mkC(m,'m',can,ins,lk,`sM('${m.id}')`);
  }
  h+=`<div class="psec">🤖 Мехи</div>`;
  for(const mc of MECHS){const own=p.mech===mc.id||p.inv.some(x=>x.type==='mech'&&x.id===mc.id);const lk=p.lvl<mc.lv;const can=!own&&!lk&&(mc.p===0||p.cr>=mc.p);h+=`<div class="icard ${own?'owned':''} ${lk?'locked':''}" onclick="${can?`sMc('${mc.id}')`:'void 0'}"><span class="ilvl ${lk?'no':'ok'}">LV${mc.lv}</span><div class="iname">${mc.n}${own?' ✓':''}</div><div class="istat">${mc.d} · Базовый HP: ${mc.bhp}</div><div class="iprice">${mc.p===0?'<span style="color:#40a020">БЕСПЛАТНО</span>':mc.p+' CR'} ${lk?`<span style="color:#c03020">🔒 LV${mc.lv}</span>`:can?`<span style="color:#408020">→ КУПИТЬ</span>`:own?`<span style="color:#808040">✓ Активен</span>`:`<span style="color:#907030">Мало CR</span>`}</div></div>`;}
  b.innerHTML=h;
}
function sW(id){const p=G.p,w=WEAPONS.find(x=>x.id===id);if(p.cr<w.p)return notify('Мало CR!');p.cr-=w.p;const sl=p.w.indexOf(null);if(sl!==-1){p.w[sl]=id;calcStats();notify('✓ '+w.n);}else if(p.inv.length<p.invMax){p.inv.push({type:'weapon',id,name:w.n});notify('→ инвентарь: '+w.n);}else{p.cr+=w.p;return notify('Нет места!');}updHUD();rShop();}
function sM(id){const p=G.p,m=MODULES.find(x=>x.id===id);if(p.cr<m.p)return notify('Мало CR!');p.cr-=m.p;const arr=m.sl==='en'?p.enSl:p.arSl;const sl=arr.indexOf(null);if(sl!==-1){arr[sl]=id;calcStats();notify('✓ '+m.n);}else if(p.inv.length<p.invMax){p.inv.push({type:'module',id,name:m.n});notify('→ инвентарь: '+m.n);}else{p.cr+=m.p;return notify('Нет места!');}updHUD();rShop();}
function sMc(id){const p=G.p,mc=MECHS.find(x=>x.id===id);if(p.cr<mc.p)return notify('Мало CR!');p.cr-=mc.p;p.mech=id;calcStats();notify('✓ '+mc.n);updHUD();rShop();}

// ═══════════════════════════════════
// AUTO BATTLE TOGGLE
// ═══════════════════════════════════
function toggleAuto(){
  G.autoBattle=!G.autoBattle;
  const btn=document.getElementById('auto-btn');
  const state=document.getElementById('auto-state');
  if(G.autoBattle){
    btn.className='on';
    if(state)state.textContent='ВКЛ';
    notify('🤖 Автобой ВКЛ');
  } else {
    btn.className='off';
    if(state)state.textContent='ВЫКЛ';
    notify('🤖 Автобой ВЫКЛ');
  }
}

// ═══════════════════════════════════
// REPAIR (Mechanic NPC)
// ═══════════════════════════════════
function tryRepair(){
  const p=G.p;
  if(p.hp>=p.maxHp)return notify('HP полный — ремонт не нужен!');
  const cost=repairCost();
  if(p.cr<cost)return notify('Мало CR! Нужно '+cost+' CR');
  p.cr-=cost;p.hp=p.maxHp;
  notify('🔧 МЕХ ВОССТАНОВЛЕН! -'+cost+' CR');updHUD();
}

// ═══════════════════════════════════
// BIG MAP
// ═══════════════════════════════════
let bigmapOpen=false;
// Minimap bounds on screen (set by drawMinimap)
let MM_X=0,MM_Y=0,MM_W=82,MM_H=82;

function handleCanvasClick(e){
  if(!G.started)return;
  const rect=C.getBoundingClientRect();
  const cx=e.clientX-rect.left,cy=e.clientY-rect.top;
  // check if click is inside minimap
  if(cx>=MM_X&&cx<=MM_X+MM_W&&cy>=MM_Y&&cy<=MM_Y+MM_H){
    openBigmap();
    e.stopPropagation();
    return;
  }
  // check mechanic NPC proximity tap
  for(const n of G.npcs){
    if(n.type==='mechanic'){
      const d=Math.hypot(G.p.wx-n.wx,G.p.wy-n.wy);
      if(d<15)tryRepair();
    }
  }
}

function openBigmap(){
  const overlay=document.getElementById('bigmap');
  if(!overlay)return;
  overlay.style.display='flex';bigmapOpen=true;
  renderBigmap();
}

function closeBigmap(){
  const overlay=document.getElementById('bigmap');
  if(overlay)overlay.style.display='none';
  bigmapOpen=false;
}

function renderBigmap(){
  const bc=document.getElementById('bigmap-canvas');
  if(!bc)return;
  const cw=window.innerWidth*0.92;
  const ch=window.innerHeight*0.72;
  bc.width=Math.min(cw,500);bc.height=Math.min(ch,500);
  const bctx=bc.getContext('2d');
  const bw=bc.width,bh=bc.height;
  const scx=bw/WW,scy=bh/WH;
  const z=ZONES[G.zone];

  // background
  bctx.fillStyle=z.ground||'#3a3820';bctx.fillRect(0,0,bw,bh);

  // draw terrain sample (walls/water/safe zone)
  const step=4; // sample every 4 tiles for performance
  for(let ty=0;ty<WH;ty+=step){
    for(let tx=0;tx<WW;tx+=step){
      const t=getTile(tx,ty);
      if(t==='wall'){bctx.fillStyle='#606048aa';bctx.fillRect(tx*scx,ty*scy,step*scx+1,step*scy+1);}
      else if(t==='water'){bctx.fillStyle='#1a3050aa';bctx.fillRect(tx*scx,ty*scy,step*scx+1,step*scy+1);}
      else if(t==='rock'){bctx.fillStyle='#50483888';bctx.fillRect(tx*scx,ty*scy,step*scx+1,step*scy+1);}
    }
  }

  // safe zone
  bctx.fillStyle='#40a02055';bctx.fillRect(SZ_X*scx,SZ_Y*scy,SZ_W*scx,SZ_H*scy);
  bctx.strokeStyle='#80e040bb';bctx.lineWidth=2;bctx.strokeRect(SZ_X*scx,SZ_Y*scy,SZ_W*scx,SZ_H*scy);
  bctx.fillStyle='#80e040';bctx.font='bold 10px Courier New';bctx.textAlign='center';bctx.textBaseline='middle';
  bctx.fillText('🛡 БЗ',(SZ_X+SZ_W/2)*scx,(SZ_Y+SZ_H/2)*scy);

  // portals
  for(const p of G.portals){
    bctx.fillStyle=p.col;bctx.shadowColor=p.col;bctx.shadowBlur=8;
    bctx.beginPath();bctx.arc(p.wx*scx,p.wy*scy,6,0,Math.PI*2);bctx.fill();bctx.shadowBlur=0;
    bctx.fillStyle='#fff';bctx.font='8px Courier New';bctx.textAlign='center';bctx.textBaseline='bottom';
    bctx.fillText(p.back?'← НАЗАД':'→ '+ZONES[p.toZone].name,p.wx*scx,p.wy*scy-7);
  }

  // boss
  if(G.boss&&!G.boss.dead){
    bctx.fillStyle='#ff3030';bctx.shadowColor='#ff3030';bctx.shadowBlur=12;
    bctx.beginPath();bctx.arc(G.boss.wx*scx,G.boss.wy*scy,8,0,Math.PI*2);bctx.fill();bctx.shadowBlur=0;
    bctx.fillStyle='#ff8080';bctx.font='bold 8px Courier New';bctx.textAlign='center';bctx.textBaseline='bottom';
    bctx.fillText('☠ '+G.boss.name,G.boss.wx*scx,G.boss.wy*scy-10);
  }

  // monsters (dots)
  for(const m of G.mons){
    if(m.dead||m.hp<=0)continue;
    bctx.fillStyle=m.tier===2?'#ff3030':m.tier===1?'#4488ff':'#e07020';
    bctx.beginPath();bctx.arc(m.wx*scx,m.wy*scy,m.tier>0?2.5:1.5,0,Math.PI*2);bctx.fill();
  }

  // player
  bctx.fillStyle='#d4c040';bctx.shadowColor='#d4c040';bctx.shadowBlur=10;
  bctx.beginPath();bctx.arc(G.p.wx*scx,G.p.wy*scy,6,0,Math.PI*2);bctx.fill();bctx.shadowBlur=0;
  bctx.strokeStyle='#ffffff';bctx.lineWidth=1.5;
  bctx.beginPath();bctx.arc(G.p.wx*scx,G.p.wy*scy,6,0,Math.PI*2);bctx.stroke();

  // legend
  const lx=8,ly=bh-60;
  bctx.fillStyle='#000000aa';bctx.fillRect(lx-4,ly-4,130,58);
  bctx.font='9px Courier New';
  bctx.fillStyle='#d4c040';bctx.fillText('● Ты',lx+8,ly+10);
  bctx.fillStyle='#ff3030';bctx.fillText('● Босс',lx+8,ly+22);
  bctx.fillStyle='#e07020';bctx.fillText('● Монстры',lx+8,ly+34);
  bctx.fillStyle=z.acc;bctx.fillText('● Портал',lx+8,ly+46);

  // zone label
  bctx.fillStyle='rgba(0,0,0,0.5)';bctx.fillRect(bw/2-70,4,140,20);
  bctx.fillStyle=z.acc;bctx.font='bold 11px Courier New';bctx.textAlign='center';bctx.textBaseline='top';
  bctx.fillText('КАРТА — '+z.name,bw/2,7);
}

// ═══════════════════════════════════
// NOTIFY
// ═══════════════════════════════════
let ntT=null;
function notify(msg){const el=document.getElementById('notif');el.textContent=msg;el.style.opacity=1;clearTimeout(ntT);ntT=setTimeout(()=>el.style.opacity=0,2600);}

// ═══════════════════════════════════
// JOYSTICK
// ═══════════════════════════════════
const jb2=document.getElementById('jbase'),jk2=document.getElementById('jknob');
let jA=false,jID=null,jO={x:0,y:0};const MJ=34;
// bigmap bounds tracking
// canvas touch → click handler for minimap
C.addEventListener('touchend',function(e){
  if(!G.started)return;
  const t=e.changedTouches[0];if(!t)return;
  const rect=C.getBoundingClientRect();
  const cx=t.clientX-rect.left,cy=t.clientY-rect.top;
  if(cx>=MM_X&&cx<=MM_X+MM_W&&cy>=MM_Y&&cy<=MM_Y+MM_H){e.preventDefault();openBigmap();return;}
  // mechanic tap
  for(const n of G.npcs){if(n.type==='mechanic'){const d=Math.hypot(G.p.wx-n.wx,G.p.wy-n.wy);if(d<15){tryRepair();return;}}}
},{passive:false});
document.getElementById('jpad').addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];jID=t.identifier;jA=true;const r=jb2.getBoundingClientRect();jO={x:r.left+r.width/2,y:r.top+r.height/2};},{passive:false});
document.addEventListener('touchmove',e=>{if(!jA)return;e.preventDefault();const t=Array.from(e.touches).find(t=>t.identifier===jID);if(!t)return;let dx=t.clientX-jO.x,dy=t.clientY-jO.y;const d=Math.hypot(dx,dy);if(d>MJ){dx=dx/d*MJ;dy=dy/d*MJ;}jk2.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;G.jd={x:dx/MJ,y:dy/MJ};},{passive:false});
document.addEventListener('touchend',e=>{if(!jA)return;const t=Array.from(e.changedTouches).find(t=>t.identifier===jID);if(!t)return;jA=false;jID=null;jk2.style.transform='translate(-50%,-50%)';G.jd={x:0,y:0};});
document.addEventListener('keydown',e=>{if(e.key==='a'||e.key==='ArrowLeft')G.jd.x=-1;if(e.key==='d'||e.key==='ArrowRight')G.jd.x=1;if(e.key==='w'||e.key==='ArrowUp')G.jd.y=-1;if(e.key==='s'||e.key==='ArrowDown')G.jd.y=1;if(e.key==='1')ft(0,null);if(e.key==='2')ft(1,null);if(e.key==='e')op('shop');if(e.key==='q')op('mech');if(e.key==='i')op('inv');if(e.key==='Escape')cp();});
document.addEventListener('keyup',e=>{if(e.key==='a'||e.key==='d'||e.key==='ArrowLeft'||e.key==='ArrowRight')G.jd.x=0;if(e.key==='w'||e.key==='s'||e.key==='ArrowUp'||e.key==='ArrowDown')G.jd.y=0;});
</script>
